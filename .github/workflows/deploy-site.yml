                <button type="button" class="gc-principal" id="gc-perfil-salvar">Salvar</button>
              </div>
            </div>
          </div>

          <script id="cadastro-unico-cliente-script">
          (function(){
            var PHONE_KEY="gleison_telefone";
            var NAME_KEY="gleison_nome";
            var EMAIL_KEY="gleison_email";

            function digits(v){return String(v||"").replace(/\D/g,"");}
            function fmtPhone(v){
              var d=digits(v).slice(0,11);
              if(d.length<=2)return d;
              if(d.length<=7)return "("+d.slice(0,2)+") "+d.slice(2);
              return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
            }
            function getSB(){
              try{
                if(typeof supabaseClient!=="undefined" && supabaseClient) return supabaseClient;
              }catch(e){}
              return window.supabaseClient||null;
            }
            function getSaved(){
              return {
                nome:(localStorage.getItem(NAME_KEY)||"").trim(),
                telefone:(localStorage.getItem(PHONE_KEY)||"").trim(),
                email:(localStorage.getItem(EMAIL_KEY)||"").trim()
              };
            }
            function saveLocal(c){
              try{
                localStorage.setItem(NAME_KEY,c.nome||"");
                localStorage.setItem(PHONE_KEY,c.telefone||"");
                localStorage.setItem(EMAIL_KEY,c.email||"");
              }catch(e){}
