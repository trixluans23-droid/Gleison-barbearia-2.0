          .gc-rec-link{display:block;width:100%;margin-top:12px;padding:10px 4px;background:transparent!important;border:0!important;color:#f2c14e!important;font:700 13px Arial,sans-serif!important;text-align:center;cursor:pointer}
          </style>

          <div id="gc-recuperacao-overlay" aria-hidden="true">
            <div class="gc-rec-modal" role="dialog" aria-modal="true" aria-labelledby="gc-recuperacao-titulo">
              <h2 id="gc-recuperacao-titulo">🔐 Recuperar minha conta</h2>
              <p>Perdeu o celular ou o número? Informe o e-mail que estava cadastrado. Enviaremos um link seguro para recuperar seu cadastro.</p>
              <label for="gc-recuperacao-email">E-mail cadastrado</label>
              <input id="gc-recuperacao-email" type="email" maxlength="160" autocomplete="email" placeholder="seuemail@exemplo.com">
              <div id="gc-recuperacao-msg"></div>
              <div class="gc-rec-acoes">
                <button type="button" id="gc-recuperacao-fechar">Fechar</button>
                <button type="button" class="gc-rec-principal" id="gc-recuperacao-enviar">Enviar link</button>
              </div>
            </div>
          </div>

          <script id="recuperacao-conta-cliente-script">
          (function(){
            var PHONE_KEY="gleison_telefone";
            var NAME_KEY="gleison_nome";
            var EMAIL_KEY="gleison_email";

            function getSB(){
              try{
                if(typeof supabaseClient!=="undefined" && supabaseClient) return supabaseClient;
              }catch(e){}
              return window.supabaseClient||null;
            }
            function digits(v){return String(v||"").replace(/\D/g,"");}
            function fmtPhone(v){
              var d=digits(v).slice(0,11);
              if(d.length<=2)return d;
              if(d.length<=7)return "("+d.slice(0,2)+") "+d.slice(2);
              return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
            }
            function saveLocal(c){
              try{
                localStorage.setItem(NAME_KEY,c.nome||"");
                localStorage.setItem(PHONE_KEY,c.telefone||"");
                localStorage.setItem(EMAIL_KEY,c.email||"");
              }catch(e){}
            }
            function setMsg(text,cls){
              var el=document.getElementById("gc-recuperacao-msg");
              if(el){el.textContent=text||"";el.className=cls||"gc-rec-info";}
            }
            function abrir(){
              var el=document.getElementById("gc-recuperacao-overlay");
              if(el){el.classList.add("aberto");el.setAttribute("aria-hidden","false");}
              var inp=document.getElementById("gc-recuperacao-email");
              if(inp){inp.value=(localStorage.getItem(EMAIL_KEY)||"");setTimeout(function(){inp.focus();},80);}
              setMsg("","");
            }
            function fechar(){
              var el=document.getElementById("gc-recuperacao-overlay");
              if(el){el.classList.remove("aberto");el.setAttribute("aria-hidden","true");}
            }

            async function concluirRecuperacao(){
              var sb=getSB();
              if(!sb || !sb.auth)return;
              try{
                var sess=await sb.auth.getSession();
                var session=sess && sess.data ? sess.data.session : null;
                if(!session || !session.user || !session.user.email)return;

                var r=await sb.rpc("recuperar_conta_cliente_logado");
                if(r.error)throw r.error;
                var c=Array.isArray(r.data)?(r.data[0]||null):r.data;
                if(!c)throw new Error("Não encontramos um cadastro de cliente com este e-mail.");

                saveLocal({
                  nome:c.nome||"",
                  telefone:c.telefone||"",
                  email:c.email||session.user.email
                });

                fechar();
                var cadastro=document.getElementById("gc-cadastro-overlay");
                if(cadastro){cadastro.classList.remove("aberto");cadastro.setAttribute("aria-hidden","true");}

                if(typeof window.location!=="undefined"){
                  window.location.replace(window.location.pathname+"?recuperado="+Date.now());
                }
              }catch(e){
                console.error("Recuperação de conta:",e);
                setMsg(e.message||"Não foi possível recuperar sua conta.","gc-rec-erro");
                try{await sb.auth.signOut();}catch(_){}
              }
            }

            async function enviarLink(){
              var btn=document.getElementById("gc-recuperacao-enviar");
              var email=(document.getElementById("gc-recuperacao-email")||{}).value||"";
              email=email.trim().toLowerCase();
              if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
                setMsg("Digite um e-mail válido.","gc-rec-erro");
                return;
              }
              var sb=getSB();
              if(!sb || !sb.auth){
                setMsg("Sistema ainda está carregando. Tente novamente.","gc-rec-erro");
                return;
              }
              btn.disabled=true;
              setMsg("Enviando o link de recuperação...","gc-rec-info");
              try{
                var redirectTo=window.location.href.split("#")[0].split("?")[0];
                var r=await sb.auth.signInWithOtp({
                  email:email,
                  options:{
                    shouldCreateUser:true,
                    emailRedirectTo:redirectTo
                  }
                });
                if(r.error)throw r.error;
                setMsg("Link enviado. Abra o e-mail e toque no link para recuperar sua conta.","gc-rec-ok");
                btn.disabled=false;
              }catch(e){
                console.error("Envio de recuperação:",e);
                setMsg(e.message||"Não foi possível enviar o link. Verifique o e-mail e tente novamente.","gc-rec-erro");
                btn.disabled=false;
              }
            }

            function adicionarLinkRecuperacao(){
              var cadastro=document.getElementById("gc-cadastro-overlay");
              if(cadastro && !document.getElementById("gc-abrir-recuperacao-cadastro")){
                var b=document.createElement("button");
                b.id="gc-abrir-recuperacao-cadastro";
                b.type="button";
                b.className="gc-rec-link";
                b.textContent="🔐 Já sou cliente e perdi meu acesso";
                b.addEventListener("click",function(){abrir();});
                var acoes=cadastro.querySelector(".gc-acoes");
                if(acoes)acoes.parentNode.appendChild(b);
              }

              var perfil=document.querySelector("#gc-perfil-overlay .gc-acoes");
              if(perfil && !document.getElementById("gc-abrir-recuperacao-perfil")){
                var b2=document.createElement("button");
                b2.id="gc-abrir-recuperacao-perfil";
                b2.type="button";
                b2.className="gc-rec-link";
                b2.textContent="🔐 Recuperar acesso pelo e-mail";
                b2.addEventListener("click",function(){abrir();});
                perfil.parentNode.appendChild(b2);
              }
            }

            function ligar(){
              var enviar=document.getElementById("gc-recuperacao-enviar");
              if(enviar)enviar.addEventListener("click",enviarLink);
              var fecharBtn=document.getElementById("gc-recuperacao-fechar");
              if(fecharBtn)fecharBtn.addEventListener("click",fechar);
              var ov=document.getElementById("gc-recuperacao-overlay");
              if(ov)ov.addEventListener("click",function(e){if(e.target===ov)fechar();});
              adicionarLinkRecuperacao();

              var sb=getSB();
              if(sb && sb.auth){
                sb.auth.onAuthStateChange(function(event){
                  if(event==="SIGNED_IN" || event==="INITIAL_SESSION"){
                    setTimeout(concluirRecuperacao,250);
                  }
                });
                setTimeout(concluirRecuperacao,700);
              }
            }

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",function(){setTimeout(ligar,700);});
            }else{
              setTimeout(ligar,700);
            }
          })();
          </script>
          '''

          if 'id="recuperacao-conta-cliente-style"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Recuperação de conta do cliente adicionada.")
          PY

