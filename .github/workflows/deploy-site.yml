name: Publicar sistema online
# Publicação da ordenação da agenda administrativa

on:
  workflow_dispatch:
  push:
    paths:
      - 'GleisonBarbearia_2.0_V27_FCM.zip'
      - 'admin.html'
      - '.github/workflows/deploy-site.yml'
      - 'scripts/sincronizar_horarios_cliente.py'
      - 'scripts/adicionar_foto_perfil_cliente.py'
      - 'file_00000000418c820e9ae7d7eeedbc5a98.png'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar sistema
        run: |
          rm -rf GleisonBarbeariaAndroid
          rm -rf site

          unzip -o "GleisonBarbearia_2.0_V27_FCM.zip"

          test -f GleisonBarbeariaAndroid/app/src/main/assets/index.html
          test -f admin.html

          mkdir -p site

          cp GleisonBarbeariaAndroid/app/src/main/assets/index.html site/index.html
          cp admin.html site/admin.html
          cp file_00000000418c820e9ae7d7eeedbc5a98.png site/logo-barbearia.png

          echo "Sistema preparado para publicação."
          python3 scripts/sincronizar_horarios_cliente.py
          python3 scripts/integrar_lembrete_online.py

      - name: Identidade do site da Gleison Barbearia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          meta='''<meta name="theme-color" content="#171b1f"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Gleison Barbearia — agendamento online e atendimento."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'''
          if 'name="theme-color"' not in s and "</head>" in s:
              s=s.replace("</head>",meta+"</head>",1)
          s=s.replace("<title>Gleison Barbearia</title>","<title>Gleison Barbearia | Agendamento Online</title>",1)
          if "<title>" not in s and "</head>" in s:
              s=s.replace("</head>","<title>Gleison Barbearia | Agendamento Online</title></head>",1)
          p.write_text(s,encoding="utf-8")
          print("Identidade do site aplicada.")
          PY


      - name: Colocar logo somente dentro do banner principal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          code='''<style id="logo-banner-final-style">
          .gc-logo-banner-final{position:absolute!important;right:8px!important;top:50%!important;transform:translateY(-50%)!important;width:42%!important;height:90%!important;object-fit:contain!important;z-index:2!important;pointer-events:none!important}
          </style>
          <script id="logo-banner-final-script">
          (function(){
            function aplicar(){
              var h=null,els=document.querySelectorAll("h1,h2,h3,div,p,span");
              for(var i=0;i<els.length;i++){
                var t=String(els[i].innerText||els[i].textContent||"").replace(/\s+/g," ").trim().toLowerCase();
                if(t.indexOf("seu estilo começa aqui")>=0){h=els[i];break;}
              }
              if(!h)return;
              var vw=document.documentElement.clientWidth,banner=null,best=0;
              for(var p=h.parentElement,n=0;p&&n<8;n++,p=p.parentElement){
                var r=p.getBoundingClientRect();
                if(r.width>=vw*0.88 && r.height>=180 && r.height<=520 && r.top>=0){
                  if(r.width>best){best=r.width;banner=p;}
                }
              }
              if(!banner)return;
              if(getComputedStyle(banner).position==="static")banner.style.position="relative";
              var logo=banner.querySelector(".gc-logo-banner-final");
              if(!logo){
                logo=document.createElement("img");
                logo.className="gc-logo-banner-final";
                logo.src="logo-barbearia.png";
                logo.alt="Gleison Barbearia";
                banner.appendChild(logo);
              }
            }
            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(aplicar,500);setTimeout(aplicar,1500)});
            else{setTimeout(aplicar,500);setTimeout(aplicar,1500);}
          })();
          </script>
          '''
          if 'id="logo-banner-final-script"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)
          p.write_text(s,encoding="utf-8")
          print("Logo aplicado somente dentro do banner, sem alterar largura ou fundo da página.")
          PY

      - name: Sincronizar horários configurados pelo administrador com a agenda do cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <script id="horarios-funcionamento-cliente-online">
          (function(){
            let cache={abertura:'09:00',fechamento:'20:30',fechamentoSabado:'23:00'};
            const excecoes={};

            function mins(v){
              const p=String(v||'').slice(0,5).split(':').map(Number);
              return p.length===2 && p.every(Number.isFinite) ? p[0]*60+p[1] : null;
            }

            async function carregarHorarios(){
              try{
                const r=await supabaseClient.rpc('obter_horarios_funcionamento',{});
                if(r.error) throw r.error;
                const row=Array.isArray(r.data)?r.data[0]:r.data;
                if(row){
                  cache={
                    abertura:String(row.hora_abertura||'09:00').slice(0,5),
                    fechamento:String(row.hora_fechamento||'20:30').slice(0,5),
                    fechamentoSabado:String(row.hora_fechamento_sabado||'23:00').slice(0,5)
                  };
                }
              }catch(e){ console.warn('Horários do administrador:',e); }
              return cache;
            }

            async function carregarExcecao(data){
              if(!data) return null;
              try{
                const r=await supabaseClient.rpc('listar_excecoes_funcionamento',{
                  p_inicio:data,p_fim:data
                });
                if(r.error) throw r.error;
                const row=Array.isArray(r.data)?(r.data[0]||null):r.data;
                excecoes[data]=row||null;
                return excecoes[data];
              }catch(e){
                console.warn('Exceção de funcionamento:',e);
                excecoes[data]=null;
                return null;
              }
            }

            function dia(data){
              const p=String(data||'').split('-').map(Number);
              return p.length===3 && p.every(Number.isFinite)
                ? new Date(p[0],p[1]-1,p[2]).getDay()
                : new Date().getDay();
            }

            window.horarioFuncionamentoCliente=function(data){
              const d=dia(data||dataLocalHoje());
              const ex=excecoes[data||dataLocalHoje()];
              if(ex && ex.aberta===false) return null;
              if((d===0 || d===1) && !(ex && ex.aberta===true)) return null;

              const inicio=mins(cache.abertura);
              const fim=mins(d===6 ? cache.fechamentoSabado : cache.fechamento);
              if(inicio===null || fim===null || fim<=inicio) return null;
              return {
                inicio:inicio,
                fim:fim,
                fimTexto:d===6 ? cache.fechamentoSabado : cache.fechamento
              };
            };

            window.estaDentroDoHorarioCliente=function(){
              const h=window.horarioFuncionamentoCliente(dataLocalHoje());
              if(!h) return false;
              const agora=new Date();
              const m=agora.getHours()*60+agora.getMinutes();
              return m>=h.inicio && m<h.fim;
            };

            window.dataFechadaPorDia=function(data){
              const d=dia(data);
              const ex=excecoes[data];
              if(ex && ex.aberta===true) return false;
              if(ex && ex.aberta===false) return true;
              return d===0 || d===1;
            };

            window.getTimesForDate=function(data){
              const h=window.horarioFuncionamentoCliente(data);
              if(!h) return [];
              const lista=[];
              for(let m=h.inicio;m<=h.fim;m+=30){
                if(m>11*60 && m<14*60) continue;
                lista.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
              }
              return lista;
            };

            async function atualizarAgendaCliente(){
              const input=document.getElementById('date');
              const data=input && input.value;
              if(!data) return;
              await carregarHorarios();
              await carregarExcecao(data);
              if(typeof loadOccupiedTimes==='function') await loadOccupiedTimes();
              if(typeof renderTimes==='function') renderTimes();
            }

            const originalOpen=window.openBooking;
            if(typeof originalOpen==='function'){
              window.openBooking=async function(){
                const input=document.getElementById('date');
                const data=input && input.value;
                await carregarHorarios();
                if(data) await carregarExcecao(data);
                return originalOpen.apply(this,arguments);
              };
            }

            const originalConfirm=window.confirmBooking;
            if(typeof originalConfirm==='function'){
              window.confirmBooking=async function(){
                const input=document.getElementById('date');
                const data=input && input.value;
                await carregarHorarios();
                if(data) await carregarExcecao(data);
                return originalConfirm.apply(this,arguments);
              };
            }

            document.addEventListener('DOMContentLoaded',function(){
              carregarHorarios().then(function(){
                const input=document.getElementById('date');
                if(input && input.value) atualizarAgendaCliente();
              });
              const input=document.getElementById('date');
              if(input){
                input.addEventListener('change',atualizarAgendaCliente);
              }
              setInterval(function(){
                const modal=document.getElementById('bookingModal');
                if(modal && modal.classList.contains('show')) atualizarAgendaCliente();
                else carregarHorarios();
              },15000);
            });
          })();
          </script>
          '''

          if 'id="horarios-funcionamento-cliente-online"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)
          p.write_text(s,encoding="utf-8")
          print("Agenda do cliente sincronizada com os horários salvos pelo administrador.")
          PY

