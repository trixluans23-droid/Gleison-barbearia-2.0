name: Publicar sistema online
# Publicação da ordenação da agenda administrativa

on:
  workflow_dispatch:
  push:
    paths:
      - 'GleisonBarbearia_2.0_V27_FCM.zip'
      - 'admin.html'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar sistema
        run: |
          rm -rf GleisonBarbeariaAndroid
          rm -rf site

          unzip -o "GleisonBarbearia_2.0_V27_FCM.zip"

          test -f GleisonBarbeariaAndroid/app/src/main/assets/index.html
          test -f admin.html

          mkdir -p site

          cp GleisonBarbeariaAndroid/app/src/main/assets/index.html site/index.html
          cp admin.html site/admin.html

          echo "Sistema preparado para publicação."

      - name: Sincronizar horários configurados pelo administrador com a agenda do cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("GleisonBarbeariaAndroid/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")

          old=r"""function horarioFuncionamentoCliente(){
            const agora=new Date();
            const dia=agora.getDay();
            // 0 = domingo, 1 = segunda, 2 = terça, 3 = quarta, 4 = quinta, 5 = sexta, 6 = sábado
            if(dia===0 || dia===1) return null;
            if(dia===6) return {inicio:9*60, fim:23*60, fimTexto:'23:00'};
            return {inicio:9*60, fim:20*60+30, fimTexto:'20:30'};
          }"""
          new=r"""let horariosFuncionamentoClienteCache={
            abertura:'09:00',
            fechamento:'20:30',
            fechamentoSabado:'23:00'
          };
          let excecoesFuncionamentoClienteCache={};

          function minutosHorarioCliente(v){
            const p=String(v||'').slice(0,5).split(':').map(Number);
            if(p.length!==2 || p.some(Number.isNaN)) return null;
            return p[0]*60+p[1];
          }

          async function carregarHorariosFuncionamentoCliente(){
            try{
              const {data,error}=await supabaseClient.rpc('obter_horarios_funcionamento',{});
              if(error) throw error;
              const row=Array.isArray(data)?data[0]:data;
              if(row){
                horariosFuncionamentoClienteCache={
                  abertura:String(row.hora_abertura||'09:00').slice(0,5),
                  fechamento:String(row.hora_fechamento||'20:30').slice(0,5),
                  fechamentoSabado:String(row.hora_fechamento_sabado||'23:00').slice(0,5)
                };
              }
            }catch(error){
              console.error('Erro ao carregar horários configurados:',error);
            }
            return horariosFuncionamentoClienteCache;
          }

          async function carregarExcecaoFuncionamentoCliente(date){
            if(!date) return null;
            if(Object.prototype.hasOwnProperty.call(excecoesFuncionamentoClienteCache,date)){
              return excecoesFuncionamentoClienteCache[date];
            }
            try{
              const {data,error}=await supabaseClient.rpc('listar_excecoes_funcionamento',{
                p_inicio:date,
                p_fim:date
              });
              if(error) throw error;
              const row=Array.isArray(data)?data[0]:null;
              excecoesFuncionamentoClienteCache[date]=row||null;
              return row||null;
            }catch(error){
              console.warn('Erro ao consultar exceção de funcionamento:',error);
              excecoesFuncionamentoClienteCache[date]=null;
              return null;
            }
          }

          function horarioFuncionamentoCliente(date){
            const alvo=date||dataLocalHoje();
            const partes=String(alvo).split('-').map(Number);
            const dia=partes.length===3 && partes.every(Number.isFinite)
              ? new Date(partes[0],partes[1]-1,partes[2]).getDay()
              : new Date().getDay();

            const excecao=excecoesFuncionamentoClienteCache[alvo];
            if((dia===0 || dia===1) && !(excecao && excecao.aberta===true)) return null;
            if(excecao && excecao.aberta===false) return null;

            const abertura=minutosHorarioCliente(horariosFuncionamentoClienteCache.abertura);
            const fechamento=minutosHorarioCliente(dia===6
              ? horariosFuncionamentoClienteCache.fechamentoSabado
              : horariosFuncionamentoClienteCache.fechamento);

            if(abertura===null || fechamento===null || fechamento<=abertura) return null;
            return {
              inicio:abertura,
              fim:fechamento,
              fimTexto:String(dia===6
                ? horariosFuncionamentoClienteCache.fechamentoSabado
                : horariosFuncionamentoClienteCache.fechamento).slice(0,5)
            };
          }"""
          if old not in s:
              raise SystemExit("Bloco horarioFuncionamentoCliente esperado não encontrado.")

          s=s.replace(old,new,1)

          old_times=r"""const timesWeekday = ["09:00","09:30","10:00","10:30","11:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30"];
          const timesSaturday = ["09:00","09:30","10:00","10:30","11:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00","22:30","23:00"];
          function getTimesForDate(date){
            if(!date) return timesWeekday;
            const parts=date.split('-').map(Number);
            if(parts.length!==3 || parts.some(Number.isNaN)) return [];
            const weekday=new Date(parts[0],parts[1]-1,parts[2]).getDay();
            if(weekday===0 || weekday===1 || weekday===2) return [];
            return weekday===6 ? timesSaturday : timesWeekday;
          }"""
          new_times=r"""function gerarHorariosCliente(inicio,fim){
            const lista=[];
            for(let m=inicio;m<=fim;m+=30){
              if(m>11*60 && m<14*60) continue;
              const h=String(Math.floor(m/60)).padStart(2,'0');
              const mi=String(m%60).padStart(2,'0');
              lista.push(h+':'+mi);
            }
            return lista;
          }

          function getTimesForDate(date){
            if(!date) return [];
            const h=horarioFuncionamentoCliente(date);
            if(!h) return [];
            return gerarHorariosCliente(h.inicio,h.fim);
          }"""
          if old_times not in s:
              raise SystemExit("Bloco getTimesForDate esperado não encontrado.")
          s=s.replace(old_times,new_times,1)

          old_closed=r"""function dataFechadaPorDia(date){
            if(!date) return false;
            const parts=date.split('-').map(Number);
            if(parts.length!==3 || parts.some(Number.isNaN)) return false;
            const weekday=new Date(parts[0],parts[1]-1,parts[2]).getDay();
            return weekday===0 || weekday===1 || weekday===2;
          }"""
          new_closed=r"""function dataFechadaPorDia(date){
            if(!date) return false;
            const parts=date.split('-').map(Number);
            if(parts.length!==3 || parts.some(Number.isNaN)) return false;
            const weekday=new Date(parts[0],parts[1]-1,parts[2]).getDay();
            const excecao=excecoesFuncionamentoClienteCache[date];
            if(excecao && excecao.aberta===true) return false;
            if(excecao && excecao.aberta===false) return true;
            return weekday===0 || weekday===1;
          }"""
          if old_closed not in s:
              raise SystemExit("Bloco dataFechadaPorDia esperado não encontrado.")
          s=s.replace(old_closed,new_closed,1)

          old_name=r"""  const weekday=new Date(parts[0],parts[1]-1,parts[2]).getDay();
            return ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][weekday] || 'data';"""
          new_name=r"""  const weekday=new Date(parts[0],parts[1]-1,parts[2]).getDay();
            return ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][weekday] || 'data';"""
          # Mantido apenas como validação estrutural; o nome do dia continua igual.
          if old_name not in s:
              raise SystemExit("Bloco nomeDiaFechado esperado não encontrado.")

          old_change=r"""  if(dateInput) dateInput.addEventListener('change', async function(){
            selectedTime="";
            const status=await obterStatusBarbeariaCliente();
            if(!status.aberta){
              document.getElementById('times').innerHTML='<div class="small" style="padding:12px;text-align:center">🔒 Agendamentos fechados pelo administrador.</div>';
              showToast('Agendamentos fechados no momento.');
              return;
            }
            await loadOccupiedTimes();
            renderTimes();
          });"""
          new_change=r"""  if(dateInput) dateInput.addEventListener('change', async function(){
            selectedTime="";
            const status=await obterStatusBarbeariaCliente();
            if(!status.aberta){
              document.getElementById('times').innerHTML='<div class="small" style="padding:12px;text-align:center">🔒 Agendamentos fechados pelo administrador.</div>';
              showToast('Agendamentos fechados no momento.');
              return;
            }
            await carregarHorariosFuncionamentoCliente();
            await carregarExcecaoFuncionamentoCliente(dateInput.value);
            await loadOccupiedTimes();
            renderTimes();
          });"""
          if old_change not in s:
              raise SystemExit("Evento de troca de data esperado não encontrado.")
          s=s.replace(old_change,new_change,1)

          old_open=r"""  selectedTime = "";
            await loadOccupiedTimes();
            renderTimes();
          }"""
          new_open=r"""  selectedTime = "";
            await carregarHorariosFuncionamentoCliente();
            await carregarExcecaoFuncionamentoCliente(dateInput.value);
            await loadOccupiedTimes();
            renderTimes();
          }"""
          # Substitui somente a primeira ocorrência no openBooking.
          if old_open not in s:
              raise SystemExit("Trecho final do openBooking não encontrado.")
          s=s.replace(old_open,new_open,1)

          old_dom=r"""  carregarServicosCliente();
            atualizarStatusBarbearia();
            atualizarBotaoDataCliente();
            setInterval(atualizarStatusBarbearia, 30000);"""
          new_dom=r"""  carregarServicosCliente();
            carregarHorariosFuncionamentoCliente().then(function(){
              const d=document.getElementById('date');
              if(d && d.value) carregarExcecaoFuncionamentoCliente(d.value).then(renderTimes);
            });
            atualizarStatusBarbearia();
            atualizarBotaoDataCliente();
            setInterval(function(){
              carregarHorariosFuncionamentoCliente();
              atualizarStatusBarbearia();
            }, 30000);"""
          if old_dom not in s:
              raise SystemExit("Inicialização do cliente esperada não encontrada.")
          s=s.replace(old_dom,new_dom,1)

          # Revalidação antes de confirmar: usa exatamente o horário salvo pelo administrador.
          old_confirm=r"""  if(dataFechadaPorDia(data)){showToast('Agendamento bloqueado: a barbearia não abre na '+nomeDiaFechado(data)+'.');renderTimes();return}
            if(!selectedTime){showToast("Escolha um horário.");return}
            if(!getTimesForDate(data).includes(selectedTime)){"""
          new_confirm=r"""  await carregarHorariosFuncionamentoCliente();
            await carregarExcecaoFuncionamentoCliente(data);
            if(dataFechadaPorDia(data)){showToast('Agendamento bloqueado: a barbearia não abre na '+nomeDiaFechado(data)+'.');renderTimes();return}
            if(!selectedTime){showToast("Escolha um horário.");return}
            if(!getTimesForDate(data).includes(selectedTime)){"""
          if old_confirm not in s:
              raise SystemExit("Validação de confirmação esperada não encontrada.")
          s=s.replace(old_confirm,new_confirm,1)

          p.write_text(s,encoding="utf-8")
          # O site ainda precisa receber o index já corrigido; o primeiro copy ocorre antes desta etapa.
          Path("site/index.html").write_text(s,encoding="utf-8")
          print("Agenda do cliente agora lê abertura/fechamento do administrador e exceções por data.")
          PY

      - name: Adicionar botão Atualizar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          code = r'''
          <button id="btn-atualizar-online" type="button" aria-label="Atualizar sistema">↻ Atualizar</button>
          <style>
          #btn-atualizar-online{position:fixed;right:16px;bottom:78px;z-index:2147483646;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px;background:#f2c14e;color:#111;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
          #btn-atualizar-online:active{transform:scale(.96)}
          </style>
          <script>
          document.getElementById("btn-atualizar-online").addEventListener("click",function(){
            this.disabled=true;
            this.textContent="↻ Atualizando...";
            var base=window.location.pathname;
            window.location.replace(base+"?atualizar="+Date.now());
          });
          </script>
          '''

          if 'id="btn-atualizar-online"' not in s and "<body>" in s:
              s = s.replace("<body>", "<body>" + code, 1)
              p.write_text(s, encoding="utf-8")

          print("Botão Atualizar adicionado ao sistema online.")
          PY

      - name: Substituir navegação inferior pelo menu de três pontos
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          # Remove o botão de perfil que a versão anterior do deploy adicionava.
          s = s.replace('<button class="header-perfil-btn" type="button" onclick="tab(\'perfil\',this)" aria-label="Meu perfil" title="Meu perfil">👤</button>', '')

          code = r'''
          <style id="menu-tres-pontos-online">
          #menu-tres-pontos-btn{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:6px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:#171b1f;color:#fff;font:700 25px/1 Arial,sans-serif;cursor:pointer;flex:0 0 44px;padding:0}
          #menu-tres-pontos-btn:active{transform:scale(.95)}
          #menu-tres-pontos-overlay{display:none;position:fixed;inset:0;z-index:2147483645;background:rgba(0,0,0,.38)}
          #menu-tres-pontos-overlay.aberto{display:block}
          #menu-tres-pontos{position:absolute;top:68px;right:14px;width:min(300px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow:auto;background:#171b1f;border:1px solid rgba(242,193,78,.35);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.5);padding:8px}
          #menu-tres-pontos .menu-titulo{padding:10px 12px 8px;color:#f2c14e;font:700 14px Arial,sans-serif}
          #menu-tres-pontos button{display:flex;align-items:center;width:100%;min-height:46px;border:0;border-radius:10px;background:transparent;color:#fff;text-align:left;padding:10px 12px;font:600 15px Arial,sans-serif;cursor:pointer}
          #menu-tres-pontos button:active,#menu-tres-pontos button:hover{background:rgba(242,193,78,.12)}
          #menu-tres-pontos button .ico{width:28px;flex:0 0 28px;font-size:18px}
          #menu-tres-pontos .menu-fechar{margin-top:4px;border-top:1px solid rgba(255,255,255,.1);color:#f2c14e}
          .nav-account-stack{display:none!important}
          .header-perfil-btn{display:none!important}
          @media(max-width:520px){
            #menu-tres-pontos-btn{width:42px;height:42px;flex-basis:42px;font-size:24px}
            #menu-tres-pontos{top:62px}
          }
          </style>

          <div id="menu-tres-pontos-overlay" aria-hidden="true">
            <div id="menu-tres-pontos" role="menu" aria-label="Menu principal">
              <div class="menu-titulo">Menu</div>
              <button type="button" data-menu-acao="perfil"><span class="ico">👤</span>Perfil</button>
              <button type="button" data-menu-acao="historico"><span class="ico">📋</span>Meu histórico</button>
              <button type="button" data-menu-acao="inicio"><span class="ico">⌂</span>Início</button>
              <button type="button" data-menu-acao="agenda"><span class="ico">📅</span>Agenda</button>
              <button type="button" data-menu-acao="mensagens"><span class="ico">💬</span>Mensagens</button>
              <button type="button" data-menu-acao="barbearia"><span class="ico">✂</span>Barbearia</button>
              <button type="button" data-menu-acao="administrador"><span class="ico">⚙</span>Administrador</button>
              <button type="button" class="menu-fechar" data-menu-acao="fechar"><span class="ico">×</span>Fechar menu</button>
            </div>
          </div>

          <script id="menu-tres-pontos-script">
          (function(){
            function fecharMenu(){
              var o=document.getElementById("menu-tres-pontos-overlay");
              if(o){o.classList.remove("aberto");o.setAttribute("aria-hidden","true");}
            }
            function abrirMenu(){
              var o=document.getElementById("menu-tres-pontos-overlay");
              if(o){o.classList.add("aberto");o.setAttribute("aria-hidden","false");}
            }
            function clicarTab(nome){
              if(typeof window.tab==="function"){
                try{ window.tab(nome); return true; }catch(e){}
              }
              var botoes=Array.prototype.slice.call(document.querySelectorAll("button,a,[role='button']"));
              var b=botoes.find(function(el){
                var t=(el.innerText||el.textContent||"").trim().toLowerCase();
                if(nome==="inicio") return t==="início"||t==="inicio";
                if(nome==="agenda") return t==="agenda"||t.includes("agendamento");
                if(nome==="mensagens") return t==="mensagens";
                if(nome==="barbearia") return t==="barbearia";
                if(nome==="perfil") return t==="perfil"||t==="meu perfil";
                return false;
              });
              if(b){b.click();return true;}
              return false;
            }
            function esconderNavegacaoInferior(){
              var els=Array.prototype.slice.call(document.querySelectorAll("nav,footer,[class*='bottom'],[class*='nav']"));
              var candidatos=els.filter(function(el){
                if(el.id==="menu-tres-pontos-overlay") return false;
                var txt=(el.innerText||"").replace(/\s+/g," ").toLowerCase();
                if(!(txt.includes("agenda")&&txt.includes("mensagens")&&txt.includes("barbearia"))) return false;
                var r=el.getBoundingClientRect(), cs=getComputedStyle(el);
                return r.bottom>=window.innerHeight-140 && (cs.position==="fixed"||cs.position==="sticky"||cs.position==="absolute");
              });
              candidatos.sort(function(a,b){return a.getBoundingClientRect().height-b.getBoundingClientRect().height;});
              if(candidatos[0]) candidatos[0].style.setProperty("display","none","important");
            }
            function prepararMenu(){
              var header=document.querySelector("header");
              if(!header || document.getElementById("menu-tres-pontos-btn")) return;
              var btn=document.createElement("button");
              btn.id="menu-tres-pontos-btn";
              btn.type="button";
              btn.setAttribute("aria-label","Abrir menu");
              btn.setAttribute("title","Menu");
              btn.innerHTML="⋮";
              btn.addEventListener("click",function(e){e.stopPropagation();abrirMenu();});
              header.appendChild(btn);
            }
            document.addEventListener("click",function(e){
              var item=e.target.closest("[data-menu-acao]");
              if(!item) return;
              var acao=item.getAttribute("data-menu-acao");
              if(acao==="fechar"){fecharMenu();return;}
              if(acao==="administrador"){window.location.href="admin.html";return;}
              fecharMenu();
              clicarTab(acao);
            });
            var overlay=document.getElementById("menu-tres-pontos-overlay");
            if(overlay) overlay.addEventListener("click",function(e){if(e.target===overlay)fecharMenu();});
            document.addEventListener("keydown",function(e){if(e.key==="Escape")fecharMenu();});
            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",function(){prepararMenu();esconderNavegacaoInferior();});
            }else{
              prepararMenu();esconderNavegacaoInferior();
            }
            window.addEventListener("resize",esconderNavegacaoInferior);
          })();
          </script>
          '''

          if 'id="menu-tres-pontos-online"' not in s and "</body>" in s:
              s = s.replace("</body>", code + "</body>", 1)

          p.write_text(s, encoding="utf-8")
          print("Menu de três pontos preparado; navegação inferior será ocultada.")
          PY

      - name: Cadastro único do cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <style id="cadastro-unico-cliente-style">
          #gc-cadastro-overlay,#gc-perfil-overlay{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
          #gc-cadastro-overlay.aberto,#gc-perfil-overlay.aberto{display:flex}
          .gc-modal{width:min(430px,100%);max-height:90vh;overflow:auto;background:#11161a;color:#fff;border:1px solid rgba(242,193,78,.35);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.65);padding:22px}
          .gc-modal h2{margin:0 0 8px;color:#f2c14e;font:800 24px Arial,sans-serif}
          .gc-modal p{margin:0 0 18px;color:#c7ccd2;font:400 14px/1.45 Arial,sans-serif}
          .gc-modal label{display:block;margin:12px 0 6px;color:#fff;font:700 13px Arial,sans-serif}
          .gc-modal input{box-sizing:border-box;width:100%;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:#171c20;color:#fff;padding:13px 14px;font:600 16px Arial,sans-serif;outline:none}
          .gc-modal input:focus{border-color:#f2c14e;box-shadow:0 0 0 2px rgba(242,193,78,.12)}
          .gc-modal .gc-acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
          .gc-modal button{border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:13px 14px;background:#171c20;color:#fff;font:800 15px Arial,sans-serif;cursor:pointer}
          .gc-modal button.gc-principal{background:#f2c14e;color:#171717;border-color:#f2c14e}
          .gc-modal button:disabled{opacity:.55;cursor:wait}
          #gc-cadastro-msg,#gc-perfil-msg{min-height:18px;margin-top:10px;font:600 13px Arial,sans-serif}
          .gc-ok{color:#4dcc83}.gc-erro{color:#ff667a}.gc-info{color:#c7ccd2}
          .gc-telefone-salvo{font:600 12px Arial,sans-serif;color:#8f989f;margin-top:5px}
          input.gc-cliente-preenchido{border-color:rgba(242,193,78,.28)!important}
          </style>

          <div id="gc-cadastro-overlay" aria-hidden="true">
            <div class="gc-modal" role="dialog" aria-modal="true" aria-labelledby="gc-cadastro-titulo">
              <h2 id="gc-cadastro-titulo">👤 Vamos cadastrar você</h2>
              <p>Faça o cadastro uma única vez. Depois, ao agendar, seu nome e telefone serão preenchidos automaticamente.</p>
              <label for="gc-cadastro-nome">Nome completo</label>
              <input id="gc-cadastro-nome" type="text" maxlength="120" autocomplete="name" placeholder="Digite seu nome">
              <label for="gc-cadastro-telefone">Telefone</label>
              <input id="gc-cadastro-telefone" type="tel" maxlength="15" inputmode="numeric" autocomplete="tel" placeholder="(11) 99999-9999">
              <label for="gc-cadastro-email">E-mail <span style="font-weight:400;color:#8f989f">(opcional)</span></label>
              <input id="gc-cadastro-email" type="email" maxlength="160" autocomplete="email" placeholder="seuemail@exemplo.com">
              <div id="gc-cadastro-msg"></div>
              <div class="gc-acoes">
                <button type="button" class="gc-principal" id="gc-cadastro-salvar">Continuar</button>
              </div>
            </div>
          </div>

          <div id="gc-perfil-overlay" aria-hidden="true">
            <div class="gc-modal" role="dialog" aria-modal="true" aria-labelledby="gc-perfil-titulo">
              <h2 id="gc-perfil-titulo">👤 Meu perfil</h2>
              <p>Seus dados ficam salvos para que você não precise digitá-los novamente ao agendar.</p>
              <label for="gc-perfil-nome">Nome completo</label>
              <input id="gc-perfil-nome" type="text" maxlength="120" autocomplete="name">
              <label for="gc-perfil-telefone">Telefone</label>
              <input id="gc-perfil-telefone" type="tel" maxlength="15" inputmode="numeric" autocomplete="tel">
              <label for="gc-perfil-email">E-mail <span style="font-weight:400;color:#8f989f">(opcional)</span></label>
              <input id="gc-perfil-email" type="email" maxlength="160" autocomplete="email">
              <div id="gc-perfil-msg"></div>
              <div class="gc-acoes">
                <button type="button" id="gc-perfil-fechar">Fechar</button>
                <button type="button" class="gc-principal" id="gc-perfil-salvar">Salvar</button>
              </div>
            </div>
          </div>

          <script id="cadastro-unico-cliente-script">
          (function(){
            var PHONE_KEY="gleison_telefone";
            var NAME_KEY="gleison_nome";
            var EMAIL_KEY="gleison_email";

            function digits(v){return String(v||"").replace(/\D/g,"");}
            function fmtPhone(v){
              var d=digits(v).slice(0,11);
              if(d.length<=2)return d;
              if(d.length<=7)return "("+d.slice(0,2)+") "+d.slice(2);
              return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
            }
            function getSB(){
              try{
                if(typeof supabaseClient!=="undefined" && supabaseClient) return supabaseClient;
              }catch(e){}
              return window.supabaseClient||null;
            }
            function getSaved(){
              return {
                nome:(localStorage.getItem(NAME_KEY)||"").trim(),
                telefone:(localStorage.getItem(PHONE_KEY)||"").trim(),
                email:(localStorage.getItem(EMAIL_KEY)||"").trim()
              };
            }
            function saveLocal(c){
              try{
                localStorage.setItem(NAME_KEY,c.nome||"");
                localStorage.setItem(PHONE_KEY,c.telefone||"");
                localStorage.setItem(EMAIL_KEY,c.email||"");
              }catch(e){}
            }
            function setMsg(id,text,cls){
              var el=document.getElementById(id);
              if(el){el.textContent=text||"";el.className=cls||"gc-info";}
            }
            function abrir(id){
              var el=document.getElementById(id);
              if(el){el.classList.add("aberto");el.setAttribute("aria-hidden","false");}
            }
            function fechar(id){
              var el=document.getElementById(id);
              if(el){el.classList.remove("aberto");el.setAttribute("aria-hidden","true");}
            }

            async function rpc(nome,args){
              var sb=getSB();
              if(!sb || typeof sb.rpc!=="function") throw new Error("Sistema ainda está carregando. Tente novamente.");
              var r=await sb.rpc(nome,args);
              if(r.error) throw r.error;
              return Array.isArray(r.data)?(r.data[0]||null):r.data;
            }

            function preencherCampos(){
              var c=getSaved();
              if(!c.telefone || digits(c.telefone).length!==11)return;

              var inputs=Array.prototype.slice.call(document.querySelectorAll("input"));
              inputs.forEach(function(el){
                if(el.closest("#gc-cadastro-overlay,#gc-perfil-overlay"))return;
                var meta=((el.id||"")+" "+(el.name||"")+" "+(el.placeholder||"")).toLowerCase();
                if(el.type==="tel" || /telefone|celular|phone/.test(meta)){
                  el.value=fmtPhone(c.telefone);
                  el.readOnly=true;
                  el.setAttribute("aria-readonly","true");
                  el.classList.add("gc-cliente-preenchido");
                  el.dispatchEvent(new Event("input",{bubbles:true}));
                  el.dispatchEvent(new Event("change",{bubbles:true}));
                }
                if(el.type==="email" || /e-?mail/.test(meta)){
                  if(c.email){el.value=c.email;el.readOnly=true;el.setAttribute("aria-readonly","true");}
                }
                if(/nome|name/.test(meta) && el.type==="text"){
                  if(c.nome){el.value=c.nome;el.readOnly=true;el.setAttribute("aria-readonly","true");el.classList.add("gc-cliente-preenchido");}
                }
              });
            }

            async function carregarCadastroExistente(){
              var c=getSaved();
              if(digits(c.telefone).length!==11)return false;
              try{
                var remoto=await rpc("obter_cliente_telefone",{p_telefone:c.telefone});
                if(remoto){
                  saveLocal({
                    nome:remoto.nome||c.nome,
                    telefone:remoto.telefone||c.telefone,
                    email:remoto.email||c.email
                  });
                }
                return true;
              }catch(e){
                return true;
              }
            }

            function prepararModalInicial(){
              var c=getSaved();
              var nome=document.getElementById("gc-cadastro-nome");
              var tel=document.getElementById("gc-cadastro-telefone");
              var email=document.getElementById("gc-cadastro-email");
              if(nome)nome.value=c.nome;
              if(tel)tel.value=fmtPhone(c.telefone);
              if(email)email.value=c.email;
              if(digits(c.telefone).length!==11)abrir("gc-cadastro-overlay");
            }

            async function salvarCadastro(){
              var btn=document.getElementById("gc-cadastro-salvar");
              var nome=(document.getElementById("gc-cadastro-nome")||{}).value||"";
              var telefone=(document.getElementById("gc-cadastro-telefone")||{}).value||"";
              var email=(document.getElementById("gc-cadastro-email")||{}).value||"";
              var d=digits(telefone);
              if(nome.trim().length<2){setMsg("gc-cadastro-msg","Digite seu nome completo.","gc-erro");return;}
              if(d.length!==11){setMsg("gc-cadastro-msg","Digite um telefone com DDD.","gc-erro");return;}
              if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMsg("gc-cadastro-msg","Confira o e-mail informado.","gc-erro");return;}
              btn.disabled=true;
              setMsg("gc-cadastro-msg","Salvando seu cadastro...","gc-info");
              try{
                var c=await rpc("salvar_cadastro_cliente",{p_nome:nome.trim(),p_telefone:d,p_email:email.trim()||null});
                if(!c)throw new Error("Não foi possível salvar o cadastro.");
                saveLocal({nome:c.nome||nome.trim(),telefone:c.telefone||d,email:c.email||email.trim()});
                fechar("gc-cadastro-overlay");
                setMsg("gc-cadastro-msg","","");
                preencherCampos();
              }catch(e){
                setMsg("gc-cadastro-msg",e.message||"Não foi possível salvar o cadastro.","gc-erro");
              }finally{
                btn.disabled=false;
              }
            }

            function abrirPerfil(){
              var c=getSaved();
              document.getElementById("gc-perfil-nome").value=c.nome||"";
              document.getElementById("gc-perfil-telefone").value=fmtPhone(c.telefone||"");
              document.getElementById("gc-perfil-email").value=c.email||"";
              setMsg("gc-perfil-msg","","");
              abrir("gc-perfil-overlay");
            }

            async function salvarPerfil(){
              var btn=document.getElementById("gc-perfil-salvar");
              var c=getSaved();
              var nome=document.getElementById("gc-perfil-nome").value.trim();
              var novo=digits(document.getElementById("gc-perfil-telefone").value);
              var email=document.getElementById("gc-perfil-email").value.trim();
              if(nome.length<2){setMsg("gc-perfil-msg","Digite seu nome completo.","gc-erro");return;}
              if(novo.length!==11){setMsg("gc-perfil-msg","Digite um telefone com DDD.","gc-erro");return;}
              if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMsg("gc-perfil-msg","Confira o e-mail informado.","gc-erro");return;}
              btn.disabled=true;
              setMsg("gc-perfil-msg","Salvando...","gc-info");
              try{
                var r=await rpc("atualizar_perfil_cliente",{
                  p_telefone_atual:c.telefone,
                  p_nome:nome,
                  p_novo_telefone:novo,
                  p_email:email||null
                });
                if(!r)throw new Error("Não foi possível atualizar o perfil.");
                saveLocal({nome:r.nome||nome,telefone:r.telefone||novo,email:r.email||email});
                fechar("gc-perfil-overlay");
                preencherCampos();
              }catch(e){
                setMsg("gc-perfil-msg",e.message||"Não foi possível atualizar o perfil.","gc-erro");
              }finally{
                btn.disabled=false;
              }
            }

            function ligarEventos(){
              var b=document.getElementById("gc-cadastro-salvar");
              if(b)b.addEventListener("click",salvarCadastro);
              var pf=document.getElementById("gc-perfil-fechar");
              if(pf)pf.addEventListener("click",function(){fechar("gc-perfil-overlay");});
              var ps=document.getElementById("gc-perfil-salvar");
              if(ps)ps.addEventListener("click",salvarPerfil);

              ["gc-cadastro-telefone","gc-perfil-telefone"].forEach(function(id){
                var el=document.getElementById(id);
                if(el)el.addEventListener("input",function(){this.value=fmtPhone(this.value);});
              });

              var pm=document.querySelector('[data-menu-acao="perfil"]');
              if(pm)pm.addEventListener("click",function(e){
                e.preventDefault();
                e.stopImmediatePropagation();
                fechar("gc-cadastro-overlay");
                abrirPerfil();
              },true);

              ["gc-cadastro-overlay","gc-perfil-overlay"].forEach(function(id){
                var ov=document.getElementById(id);
                if(ov)ov.addEventListener("click",function(e){if(e.target===ov && id==="gc-perfil-overlay")fechar(id);});
              });
            }

            async function iniciar(){
              ligarEventos();
              var tem=await carregarCadastroExistente();
              if(!tem)prepararModalInicial();
              preencherCampos();

              var observer=new MutationObserver(function(){preencherCampos();});
              if(document.body)observer.observe(document.body,{childList:true,subtree:true});
              setInterval(preencherCampos,1500);
            }

            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",iniciar);
            else setTimeout(iniciar,500);

            window.gleisonAbrirPerfil=abrirPerfil;
          })();
          </script>
          '''

          if 'id="cadastro-unico-cliente-style"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Cadastro único do cliente adicionado.")
          PY


      - name: Histórico do cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          code=r'''
          <style id="historico-cliente-online-style">
          #gc-historico-overlay{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
          #gc-historico-overlay.aberto{display:flex}
          #gc-historico-modal{width:min(470px,100%);max-height:88vh;overflow:auto;background:#11161a;color:#fff;border:1px solid rgba(242,193,78,.35);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.65);padding:20px}
          #gc-historico-modal h2{margin:0 0 6px;color:#f2c14e;font:800 23px Arial,sans-serif}
          #gc-historico-modal .gc-hist-sub{margin:0 0 14px;color:#aeb5bb;font:400 13px/1.4 Arial,sans-serif}
          .gc-hist-card{padding:13px 14px;margin:9px 0;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#171c20}
          .gc-hist-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
          .gc-hist-servico{font:800 15px Arial,sans-serif;color:#fff}
          .gc-hist-status{font:800 11px Arial,sans-serif;padding:5px 8px;border-radius:999px}
          .gc-hist-status.atendido{background:#4dcc83;color:#171717}.gc-hist-status.cancelado{background:#e53955;color:#fff}
          .gc-hist-info{margin-top:7px;color:#c7ccd2;font:600 13px/1.45 Arial,sans-serif}
          .gc-hist-preco{margin-top:5px;color:#f2c14e;font:800 14px Arial,sans-serif}
          #gc-historico-fechar{width:100%;margin-top:12px;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px;background:#171c20;color:#fff;font:800 15px Arial,sans-serif}
          .gc-hist-vazio{padding:18px 4px;color:#aeb5bb;text-align:center;font:600 14px Arial,sans-serif}
          </style>
          <div id="gc-historico-overlay" aria-hidden="true">
            <div id="gc-historico-modal" role="dialog" aria-modal="true" aria-labelledby="gc-historico-titulo">
              <h2 id="gc-historico-titulo">📋 Meu histórico</h2>
              <p class="gc-hist-sub">Seus atendimentos anteriores ficam registrados aqui.</p>
              <div id="gc-historico-lista"><div class="gc-hist-vazio">Carregando histórico...</div></div>
              <button type="button" id="gc-historico-fechar">Fechar</button>
            </div>
          </div>
          <script id="historico-cliente-online-script">
          (function(){
            function sb(){try{return window.supabaseClient||supabaseClient}catch(e){return null}}
            function digits(v){return String(v||"").replace(/\D/g,"")}
            function money(v){return v==null||v===""?"":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
            function fmtDate(v){
              var d=new Date(v); if(isNaN(d.getTime()))return "Data não disponível";
              return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"})+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
            }
            function abrir(){var o=document.getElementById("gc-historico-overlay");if(o){o.classList.add("aberto");o.setAttribute("aria-hidden","false")}}
            function fechar(){var o=document.getElementById("gc-historico-overlay");if(o){o.classList.remove("aberto");o.setAttribute("aria-hidden","true")}}
            async function carregar(){
              var lista=document.getElementById("gc-historico-lista"), telefone=localStorage.getItem("gleison_telefone")||"";
              if(!lista)return;
              if(digits(telefone).length!==11){lista.innerHTML='<div class="gc-hist-vazio">Faça seu cadastro para visualizar seu histórico.</div>';return}
              var client=sb(); if(!client){lista.innerHTML='<div class="gc-hist-vazio">Sistema ainda está carregando.</div>';return}
              lista.innerHTML='<div class="gc-hist-vazio">Carregando histórico...</div>';
              try{
                var r=await client.rpc("listar_historico_cliente",{p_telefone:telefone});
                if(r.error)throw r.error;
                var rows=Array.isArray(r.data)?r.data:[];
                if(!rows.length){lista.innerHTML='<div class="gc-hist-vazio">Você ainda não possui atendimentos anteriores.</div>';return}
                lista.innerHTML=rows.map(function(a){
                  var st=a.status==="atendido"?"Atendido":"Cancelado";
                  var cls=a.status==="atendido"?"atendido":"cancelado";
                  return '<div class="gc-hist-card"><div class="gc-hist-top"><div class="gc-hist-servico">'+String(a.servico_nome||"Serviço não informado").replace(/[&<>]/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[x]})+'</div><span class="gc-hist-status '+cls+'">'+st+'</span></div><div class="gc-hist-info">📅 '+fmtDate(a.data_hora)+'<br>✂️ '+String(a.barbeiro_nome||"Gleison")+'</div>'+(a.preco!=null?'<div class="gc-hist-preco">'+money(a.preco)+'</div>':"")+'</div>';
                }).join("");
              }catch(e){console.error(e);lista.innerHTML='<div class="gc-hist-vazio">Não foi possível carregar o histórico agora.</div>'}
            }
            window.abrirHistoricoCliente=function(){abrir();carregar()};
            document.addEventListener("click",function(e){
              var b=e.target.closest("[data-menu-acao='historico']"); if(b){e.preventDefault();e.stopImmediatePropagation();window.abrirHistoricoCliente();return}
              if(e.target.id==="gc-historico-fechar"||e.target.id==="gc-historico-overlay")fechar();
            },true);
          })();
          </script>
          '''
          if 'id="historico-cliente-online-style"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)
          p.write_text(s,encoding="utf-8")
          print("Histórico do cliente adicionado.")
          PY

      - name: Recuperação de conta do cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <style id="recuperacao-conta-cliente-style">
          #gc-recuperacao-overlay{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
          #gc-recuperacao-overlay.aberto{display:flex}
          .gc-rec-modal{width:min(430px,100%);max-height:90vh;overflow:auto;background:#11161a;color:#fff;border:1px solid rgba(242,193,78,.35);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.65);padding:22px}
