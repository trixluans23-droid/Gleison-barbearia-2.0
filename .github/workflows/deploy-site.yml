      - name: Menu dos três pontos no topo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          code = r'''
          <style id="menu-tres-pontos-online">
          #menu-tres-pontos-btn{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:6px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:#171b1f;color:#fff;font:700 25px/1 Arial,sans-serif;cursor:pointer;flex:0 0 44px;padding:0}
          #menu-tres-pontos-btn:active{transform:scale(.95)}
          #menu-tres-pontos-overlay{display:none;position:fixed;inset:0;z-index:2147483645;background:rgba(0,0,0,.38)}
          #menu-tres-pontos-overlay.aberto{display:block}
          #menu-tres-pontos{position:absolute;top:68px;right:14px;width:min(300px,calc(100vw - 28px));background:#171b1f;border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.5);padding:8px}
          #menu-tres-pontos button{display:flex;align-items:center;width:100%;min-height:48px;border:0;border-radius:10px;background:transparent;color:#fff;text-align:left;padding:11px 12px;font:700 15px Arial,sans-serif;cursor:pointer}
          #menu-tres-pontos button:active,#menu-tres-pontos button:hover{background:rgba(255,255,255,.08)}
          #menu-tres-pontos button .ico{width:30px;flex:0 0 30px;font-size:19px}
          .gc-menu-nav-hidden{display:none!important}
          @media(max-width:520px){
            #menu-tres-pontos-btn{width:42px;height:42px;flex-basis:42px;font-size:24px}
            #menu-tres-pontos{top:62px}
          }
          </style>

          <div id="menu-tres-pontos-overlay" aria-hidden="true">
            <div id="menu-tres-pontos" role="menu" aria-label="Mais opções">
              <button type="button" data-menu-acao="inicio"><span class="ico">⌂</span>Início</button>
              <button type="button" data-menu-acao="agenda"><span class="ico">📅</span>Agenda</button>
              <button type="button" data-menu-acao="perfil"><span class="ico">👤</span>Meu perfil</button>
              <button type="button" data-menu-acao="notificacoes"><span class="ico">🔔</span>Notificações</button>
              <button type="button" data-menu-acao="administrador"><span class="ico">🛡️</span>Área do administrador</button>
            </div>
          </div>

          <script id="menu-tres-pontos-script">
          (function(){
            function fecharMenu(){
              var o=document.getElementById("menu-tres-pontos-overlay");
              if(o){o.classList.remove("aberto");o.setAttribute("aria-hidden","true");}
            }
            function abrirMenu(){
              var o=document.getElementById("menu-tres-pontos-overlay");
              if(o){o.classList.add("aberto");o.setAttribute("aria-hidden","false");}
            }
            function clicarTab(nome){
              if(typeof window.tab==="function"){
                try{ window.tab(nome); return true; }catch(e){}
              }
              var b=document.querySelector("[onclick*=\"tab('"+nome+"')\"]");
              if(b){b.click();return true;}
              return false;
            }
            function esconderInicioAgendaRodape(){
              var itens=document.querySelectorAll("button, a, [role='button']");
              Array.prototype.forEach.call(itens,function(el){
                if(el.closest("#menu-tres-pontos, #menu-tres-pontos-overlay")) return;
                var t=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
                if(t!=="início" && t!=="inicio" && t!=="agenda") return;
                var r=el.getBoundingClientRect();
                if(r.top > window.innerHeight*0.65) el.classList.add("gc-menu-nav-hidden");
              });
            }
            function prepararMenu(){
              if(document.getElementById("menu-tres-pontos-btn")) return;
              var header=document.querySelector("header");
              if(!header) return;
              var btn=document.createElement("button");
              btn.id="menu-tres-pontos-btn";
              btn.type="button";
              btn.setAttribute("aria-label","Mais opções");
              btn.setAttribute("title","Mais opções");
              btn.innerHTML="⋮";
              btn.addEventListener("click",function(e){e.stopPropagation();abrirMenu();});
              header.appendChild(btn);
            }
            document.addEventListener("click",function(e){
              var item=e.target.closest("[data-menu-acao]");
              if(item){
                var acao=item.getAttribute("data-menu-acao");
                if(acao==="administrador"){fecharMenu();window.location.href="admin.html";return;}
                fecharMenu();
                if(acao==="inicio") clicarTab("inicio");
                if(acao==="agenda") clicarTab("agenda");
                if(acao==="perfil") clicarTab("perfil");
                if(acao==="notificacoes") clicarTab("notificacoes");
                return;
              }
              var overlay=document.getElementById("menu-tres-pontos-overlay");
              if(overlay && e.target===overlay) fecharMenu();
            });
            document.addEventListener("keydown",function(e){if(e.key==="Escape")fecharMenu();});
            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",function(){
                prepararMenu();
                esconderInicioAgendaRodape();
                setTimeout(esconderInicioAgendaRodape,500);
                setTimeout(esconderInicioAgendaRodape,1500);
              });
            }else{
              prepararMenu();
              esconderInicioAgendaRodape();
              setTimeout(esconderInicioAgendaRodape,500);
              setTimeout(esconderInicioAgendaRodape,1500);
            }
            document.addEventListener("click",function(){setTimeout(esconderInicioAgendaRodape,100)},true);
          })();
          </script>
          '''

          if 'id="menu-tres-pontos-online"' not in s and "</body>" in s:
              s = s.replace("</body>", code + "</body>", 1)

          p.write_text(s, encoding="utf-8")
          print("Menu dos 3 pontinhos atualizado somente no topo, com Perfil, Notificações e Área do administrador.")
          PY

      - name: Cadastro único do cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <style id="cadastro-unico-cliente-style">
          #gc-cadastro-overlay,#gc-perfil-overlay{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
