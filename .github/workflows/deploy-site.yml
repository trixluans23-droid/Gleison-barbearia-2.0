      - name: Validar recuperação de senha
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("site/index.html").read_text(encoding="utf-8")
          required=[
            'id="recuperacao-senha-email-style"',
            'id="recuperacao-senha-email-script"',
            'resetPasswordForEmail',
            'PASSWORD_RECOVERY',
            'updateUser({password:a})',
            'Esqueci minha senha'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("Validação falhou: "+", ".join(missing))
          forbidden=[
            'signInWithPasskey',
            'registerPasskey',
            'Ativar recuperação por biometria',
            'Recuperar com reconhecimento facial'
          ]
          found=[x for x in forbidden if x in s]
          if found: raise SystemExit("Validação falhou; biometria encontrada: "+", ".join(found))
          print("Recuperação de senha por e-mail OK.")
          PY

