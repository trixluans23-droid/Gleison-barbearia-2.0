              var c=String((document.getElementById("gc-rec-senha-confirma")||{}).value||"");
              if(a.length<8){msg("gc-rec-senha-nova-msg","A senha precisa ter pelo menos 8 caracteres.","gc-rec-senha-erro");return}
              if(a!==c){msg("gc-rec-senha-nova-msg","As senhas não são iguais.","gc-rec-senha-erro");return}
              var client=sb();
              if(!client||!client.auth){msg("gc-rec-senha-nova-msg","Sistema ainda está carregando. Tente novamente.","gc-rec-senha-erro");return}
              b.disabled=true;
              msg("gc-rec-senha-nova-msg","Salvando nova senha...","gc-rec-senha-info");
              try{
                var r=await client.auth.updateUser({password:a});
                if(r.error)throw r.error;
                await restaurarCadastro();
                fechar("gc-rec-senha-nova-overlay");
                msg("gc-rec-senha-msg","Senha alterada com sucesso! Seu cadastro continua salvo.","gc-rec-senha-ok");
                setTimeout(function(){window.location.replace(baseUrl()+"?senha-atualizada="+Date.now())},900);
              }catch(e){
                console.error("Nova senha:",e);
                msg("gc-rec-senha-nova-msg",e.message||"Não foi possível alterar a senha.","gc-rec-senha-erro");
              }finally{b.disabled=false}
            }

            function abrirRecuperacao(){
              var e=document.getElementById("gc-rec-senha-email");
              if(e)e.value=localStorage.getItem(EMAIL_KEY)||"";
              msg("gc-rec-senha-msg","","gc-rec-senha-info");
              abrir("gc-rec-senha-overlay");
            }

            function adicionarLinks(){
              var cadastro=document.getElementById("gc-cadastro-overlay");
              if(cadastro && !document.getElementById("gc-abrir-rec-senha-cadastro")){
                var b=document.createElement("button");
                b.id="gc-abrir-rec-senha-cadastro";b.type="button";b.className="gc-rec-senha-link";
                b.textContent="🔐 Esqueci minha senha";
                b.addEventListener("click",abrirRecuperacao);
                var a=cadastro.querySelector(".gc-acoes");
                if(a)a.parentNode.appendChild(b);
              }
              var perfil=document.querySelector("#gc-perfil-overlay .gc-acoes");
              if(perfil && !document.getElementById("gc-abrir-rec-senha-perfil")){
                var b2=document.createElement("button");
                b2.id="gc-abrir-rec-senha-perfil";b2.type="button";b2.className="gc-rec-senha-link";
                b2.textContent="🔐 Esqueci minha senha";
                b2.addEventListener("click",abrirRecuperacao);
                perfil.parentNode.appendChild(b2);
              }
            }

            function ligar(){
              var send=document.getElementById("gc-rec-senha-enviar");
              var close=document.getElementById("gc-rec-senha-fechar");
              var save=document.getElementById("gc-rec-senha-salvar");
              var close2=document.getElementById("gc-rec-senha-nova-fechar");
              if(send)send.addEventListener("click",enviar);
              if(close)close.addEventListener("click",function(){fechar("gc-rec-senha-overlay")});
              if(save)save.addEventListener("click",salvarNovaSenha);
              if(close2)close2.addEventListener("click",function(){fechar("gc-rec-senha-nova-overlay")});
              var ov=document.getElementById("gc-rec-senha-overlay");
              if(ov)ov.addEventListener("click",function(e){if(e.target===ov)fechar("gc-rec-senha-overlay")});
              adicionarLinks();

              var client=sb();
              if(client&&client.auth){
                client.auth.onAuthStateChange(function(event){
                  if(event==="PASSWORD_RECOVERY"){
                    setTimeout(function(){
                      fechar("gc-rec-senha-overlay");
                      msg("gc-rec-senha-nova-msg","","gc-rec-senha-info");
                      abrir("gc-rec-senha-nova-overlay");
                    },150);
                  }
                });
              }
              if(/[?&]code=|[?&]type=recovery/.test(window.location.search+window.location.hash)){
                setTimeout(function(){
                  var c=sb();
                  if(c&&c.auth)getTimeout();
                },500);
              }
            }

            function getTimeout(){
              var client=sb();
              if(!client||!client.auth)return;
              client.auth.getSession().then(function(r){
                if(r.data&&r.data.session){
                  fechar("gc-rec-senha-overlay");
                  abrir("gc-rec-senha-nova-overlay");
                }
              }).catch(function(){});
            }

            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(ligar,500)});
            else setTimeout(ligar,500);

            window.gleisonAbrirRecuperacaoSenha=abrirRecuperacao;
          })();
