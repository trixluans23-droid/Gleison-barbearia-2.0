name: Publicar sistema online

on:
  workflow_dispatch:
  push:
    paths:
      - 'GleisonBarbearia_2.0_V27_FCM.zip'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar sistema
        run: |
          rm -rf GleisonBarbeariaAndroid
          rm -rf site

          unzip -o "GleisonBarbearia_2.0_V27_FCM.zip"

          test -f GleisonBarbeariaAndroid/app/src/main/assets/index.html

          mkdir -p site

          cp GleisonBarbeariaAndroid/app/src/main/assets/index.html site/index.html

          echo "Sistema preparado para publicação."

      - name: Adicionar botão Atualizar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          code = r'''
          <button id="btn-atualizar-online" type="button" aria-label="Atualizar sistema">↻ Atualizar</button>
          <style>
          #btn-atualizar-online{position:fixed;right:16px;bottom:78px;z-index:2147483646;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px;background:#f2c14e;color:#111;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
          #btn-atualizar-online:active{transform:scale(.96)}
          </style>
          <script>
          document.getElementById("btn-atualizar-online").addEventListener("click",function(){
            this.disabled=true;
            this.textContent="↻ Atualizando...";
            var base=window.location.pathname;
            window.location.replace(base+"?atualizar="+Date.now());
          });
          </script>
          '''

          if 'id="btn-atualizar-online"' not in s and "<body>" in s:
              s = s.replace("<body>", "<body>" + code, 1)
              p.write_text(s, encoding="utf-8")

          print("Botão Atualizar adicionado ao sistema online.")
          PY

      - name: Mover perfil para o cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          css = r'''
          <style id="perfil-cabecalho-online">
          .header-perfil-btn{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:6px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:#171b1f;color:#fff;font-size:25px;cursor:pointer;flex:0 0 44px}
          .header-perfil-btn:active{transform:scale(.95)}
          @media(max-width:520px){.header-perfil-btn{width:42px;height:42px;flex-basis:42px;font-size:24px}}
          .nav-account-stack{display:none!important}
          </style>
          '''

          button = '<button class="header-perfil-btn" type="button" onclick="tab(\'perfil\',this)" aria-label="Meu perfil" title="Meu perfil">👤</button>'

          if 'id="perfil-cabecalho-online"' not in s and "<head>" in s:
              s = s.replace("</head>", css + "</head>", 1)

          if 'class="header-perfil-btn"' not in s and 'class="header-notificacao-btn"' in s:
              s = s.replace('</button>\n</header>', '</button>\n  ' + button + '\n</header>', 1)

          p.write_text(s, encoding="utf-8")
          print("Perfil movido para o canto superior direito.")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Criar pacote do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
