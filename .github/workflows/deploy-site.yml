              var el=document.getElementById(id);
              if(el){el.textContent=text||"";el.className=cls||"gc-info";}
            }
            function abrir(id){
              var el=document.getElementById(id);
              if(el){el.classList.add("aberto");el.setAttribute("aria-hidden","false");}
            }
            function fechar(id){
              var el=document.getElementById(id);
              if(el){el.classList.remove("aberto");el.setAttribute("aria-hidden","true");}
            }

            async function rpc(nome,args){
              var sb=getSB();
              if(!sb || typeof sb.rpc!=="function") throw new Error("Sistema ainda está carregando. Tente novamente.");
              var r=await sb.rpc(nome,args);
              if(r.error) throw r.error;
              return Array.isArray(r.data)?(r.data[0]||null):r.data;
            }

            function preencherCampos(){
              var c=getSaved();
              if(!c.telefone || digits(c.telefone).length!==11)return;

              var inputs=Array.prototype.slice.call(document.querySelectorAll("input"));
              inputs.forEach(function(el){
                if(el.closest("#gc-cadastro-overlay,#gc-perfil-overlay"))return;
                var meta=((el.id||"")+" "+(el.name||"")+" "+(el.placeholder||"")).toLowerCase();
                if(el.type==="tel" || /telefone|celular|phone/.test(meta)){
                  el.value=fmtPhone(c.telefone);
                  el.readOnly=true;
                  el.setAttribute("aria-readonly","true");
                  el.classList.add("gc-cliente-preenchido");
                  el.dispatchEvent(new Event("input",{bubbles:true}));
                  el.dispatchEvent(new Event("change",{bubbles:true}));
                }
                if(el.type==="email" || /e-?mail/.test(meta)){
                  if(c.email){el.value=c.email;el.readOnly=true;el.setAttribute("aria-readonly","true");}
                }
                if(/nome|name/.test(meta) && el.type==="text"){
                  if(c.nome){el.value=c.nome;el.readOnly=true;el.setAttribute("aria-readonly","true");el.classList.add("gc-cliente-preenchido");}
                }
              });
            }

            async function carregarCadastroExistente(){
              var c=getSaved();
              if(digits(c.telefone).length!==11)return false;
              try{
                var remoto=await rpc("obter_cliente_telefone",{p_telefone:c.telefone});
                if(remoto){
                  saveLocal({
                    nome:remoto.nome||c.nome,
                    telefone:remoto.telefone||c.telefone,
                    email:remoto.email||c.email
                  });
                }
                return true;
              }catch(e){
                return true;
              }
            }

            function prepararModalInicial(){
              var c=getSaved();
              var nome=document.getElementById("gc-cadastro-nome");
              var tel=document.getElementById("gc-cadastro-telefone");
              var email=document.getElementById("gc-cadastro-email");
              if(nome)nome.value=c.nome;
              if(tel)tel.value=fmtPhone(c.telefone);
              if(email)email.value=c.email;
              if(digits(c.telefone).length!==11)abrir("gc-cadastro-overlay");
            }

            async function salvarCadastro(){
              var btn=document.getElementById("gc-cadastro-salvar");
              var nome=(document.getElementById("gc-cadastro-nome")||{}).value||"";
              var telefone=(document.getElementById("gc-cadastro-telefone")||{}).value||"";
              var email=(document.getElementById("gc-cadastro-email")||{}).value||"";
              var d=digits(telefone);
              if(nome.trim().length<2){setMsg("gc-cadastro-msg","Digite seu nome completo.","gc-erro");return;}
              if(d.length!==11){setMsg("gc-cadastro-msg","Digite um telefone com DDD.","gc-erro");return;}
              if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMsg("gc-cadastro-msg","Confira o e-mail informado.","gc-erro");return;}
              btn.disabled=true;
              setMsg("gc-cadastro-msg","Salvando seu cadastro...","gc-info");
              try{
                var c=await rpc("salvar_cadastro_cliente",{p_nome:nome.trim(),p_telefone:d,p_email:email.trim()||null});
                if(!c)throw new Error("Não foi possível salvar o cadastro.");
                saveLocal({nome:c.nome||nome.trim(),telefone:c.telefone||d,email:c.email||email.trim()});
                fechar("gc-cadastro-overlay");
                setMsg("gc-cadastro-msg","","");
                preencherCampos();
              }catch(e){
                setMsg("gc-cadastro-msg",e.message||"Não foi possível salvar o cadastro.","gc-erro");
              }finally{
                btn.disabled=false;
              }
            }

            function abrirPerfil(){
              var c=getSaved();
              document.getElementById("gc-perfil-nome").value=c.nome||"";
              document.getElementById("gc-perfil-telefone").value=fmtPhone(c.telefone||"");
              document.getElementById("gc-perfil-email").value=c.email||"";
              setMsg("gc-perfil-msg","","");
              abrir("gc-perfil-overlay");
            }

            async function salvarPerfil(){
              var btn=document.getElementById("gc-perfil-salvar");
              var c=getSaved();
              var nome=document.getElementById("gc-perfil-nome").value.trim();
              var novo=digits(document.getElementById("gc-perfil-telefone").value);
              var email=document.getElementById("gc-perfil-email").value.trim();
              if(nome.length<2){setMsg("gc-perfil-msg","Digite seu nome completo.","gc-erro");return;}
              if(novo.length!==11){setMsg("gc-perfil-msg","Digite um telefone com DDD.","gc-erro");return;}
              if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setMsg("gc-perfil-msg","Confira o e-mail informado.","gc-erro");return;}
              btn.disabled=true;
              setMsg("gc-perfil-msg","Salvando...","gc-info");
              try{
                var r=await rpc("atualizar_perfil_cliente",{
                  p_telefone_atual:c.telefone,
                  p_nome:nome,
                  p_novo_telefone:novo,
                  p_email:email||null
                });
                if(!r)throw new Error("Não foi possível atualizar o perfil.");
                saveLocal({nome:r.nome||nome,telefone:r.telefone||novo,email:r.email||email});
                fechar("gc-perfil-overlay");
                preencherCampos();
              }catch(e){
                setMsg("gc-perfil-msg",e.message||"Não foi possível atualizar o perfil.","gc-erro");
              }finally{
                btn.disabled=false;
              }
            }

            function ligarEventos(){
              var b=document.getElementById("gc-cadastro-salvar");
              if(b)b.addEventListener("click",salvarCadastro);
              var pf=document.getElementById("gc-perfil-fechar");
              if(pf)pf.addEventListener("click",function(){fechar("gc-perfil-overlay");});
              var ps=document.getElementById("gc-perfil-salvar");
              if(ps)ps.addEventListener("click",salvarPerfil);

              ["gc-cadastro-telefone","gc-perfil-telefone"].forEach(function(id){
                var el=document.getElementById(id);
                if(el)el.addEventListener("input",function(){this.value=fmtPhone(this.value);});
              });

              var pm=document.querySelector('[data-menu-acao="perfil"]');
              if(pm)pm.addEventListener("click",function(e){
                e.preventDefault();
                e.stopImmediatePropagation();
                fechar("gc-cadastro-overlay");
                abrirPerfil();
              },true);

              ["gc-cadastro-overlay","gc-perfil-overlay"].forEach(function(id){
                var ov=document.getElementById(id);
                if(ov)ov.addEventListener("click",function(e){if(e.target===ov && id==="gc-perfil-overlay")fechar(id);});
              });
            }

            async function iniciar(){
              ligarEventos();
              var tem=await carregarCadastroExistente();
              if(!tem)prepararModalInicial();
              preencherCampos();

              var observer=new MutationObserver(function(){preencherCampos();});
              if(document.body)observer.observe(document.body,{childList:true,subtree:true});
              setInterval(preencherCampos,1500);
            }

            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",iniciar);
            else setTimeout(iniciar,500);

            window.gleisonAbrirPerfil=abrirPerfil;
          })();
          </script>
          '''

          if 'id="cadastro-unico-cliente-style"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Cadastro único do cliente adicionado.")
          PY


