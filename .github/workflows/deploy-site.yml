      - name: Corrigir carregamento da Minha agenda
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <style id="agenda-carregamento-online-style">
          .status-atendimento-encerrado{border-color:rgba(220,53,69,.8)!important;box-shadow:0 0 0 2px rgba(220,53,69,.12) inset}
          .agenda-status-cancelado{background:#e53955!important;color:#fff!important;border-color:#e53955!important}
          .agenda-status-agendado{background:#f2c14e!important;color:#171717!important;border-color:#f2c14e!important}
          .agenda-status-atendido{background:#4dcc83!important;color:#171717!important;border-color:#4dcc83!important}
          </style>
          <script id="agenda-carregamento-online">
          (function(){
            function parseDate(v){
              var m=String(v||"").match(/(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/);
              if(!m)return null;
              var d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],0,0);
              return isNaN(d.getTime())?null:d;
            }

            function dataHoraAgenda(a){
              var raw=a && a.data_hora;
              var ms=raw ? new Date(raw).getTime() : NaN;
              if(Number.isFinite(ms))return new Date(ms);
              return parseDate(typeof formatDateTime==="function"?formatDateTime(raw):"");
            }

            function statusFinal(a){
              var raw=String(a.status||"agendado").toLowerCase().trim();
              var dt=dataHoraAgenda(a);
              if(dt && dt.getTime()<Date.now() && raw!=="cancelado" && raw!=="atendido" && raw!=="faltou" && raw!=="não compareceu"){
                return "Atendimento encerrado";
              }
              return typeof statusLabel==="function" ? statusLabel(a.status) : (a.status||"Agendado");
            }

            window.loadMyAgenda=async function(){
              var list=document.getElementById("agendaList");
              if(!list)return;

              var telefone=(localStorage.getItem("gleison_telefone")||"").trim();
              if(!telefone){
                list.innerHTML='<div class="card"><b>Nenhum agendamento encontrado</b><div class="small" style="margin-top:6px">Faça um agendamento primeiro. Seus próximos horários aparecerão aqui.</div></div>';
                return;
              }

              list.innerHTML='<div class="card"><div class="small">Carregando sua agenda...</div></div>';

              try{
                var resultado=await Promise.race([
                  supabaseClient.rpc("listar_agendamentos_cliente",{p_telefone:telefone}),
                  new Promise(function(_,reject){
                    setTimeout(function(){reject(new Error("TIMEOUT_AGENDA"));},12000);
                  })
                ]);

                if(resultado.error)throw resultado.error;

                var data=Array.isArray(resultado.data)?resultado.data:[];
                data.sort(function(a,b){
                  function ordem(item){
                    var st=statusFinal(item).toLowerCase();
                    var raw=String(item.status||"").toLowerCase().trim();
                    var dt=dataHoraAgenda(item);
                    var futuro=dt && dt.getTime()>=Date.now();

                    // Próximos agendamentos/confirmados sempre ficam primeiro.
                    if((raw==="agendado"||raw==="confirmado") && futuro)return 0;

                    // Atendimentos encerrados ficam depois dos próximos.
                    if(st==="atendimento encerrado"||st==="atendido")return 1;

                    // Faltou/não compareceu ficam no histórico.
                    if(st==="faltou"||st==="não compareceu")return 2;

                    // Cancelados ficam por último.
                    if(st==="cancelado")return 3;

                    // Agendamentos que já passaram também são histórico.
                    if(raw==="agendado"||raw==="confirmado")return 1;

                    return 4;
                  }
                  var oa=ordem(a),ob=ordem(b);
                  if(oa!==ob)return oa-ob;
                  var da=dataHoraAgenda(a),db=dataHoraAgenda(b);
                  var ta=da?da.getTime():Number.MAX_SAFE_INTEGER;
                  var tb=db?db.getTime():Number.MAX_SAFE_INTEGER;
                  return ta-tb;
                });

                if(!data.length){
                  list.innerHTML='<div class="card"><b>Nenhum agendamento</b><div class="small" style="margin-top:6px">Não há horários cadastrados para este telefone.</div></div>';
                  return;
                }

                list.innerHTML=data.map(function(a){
                  var st=statusFinal(a);
                  var cls=st==="Atendimento encerrado"?" status-atendimento-encerrado":"";
                  var statusCor=String(st||"").toLowerCase();
                  var estiloBadge=statusCor==="cancelado"?' style="background:#e53955!important;color:#fff!important;border-color:#e53955!important"':((statusCor==="agendado"||statusCor==="confirmado")?' style="background:#f2c14e!important;color:#171717!important;border-color:#f2c14e!important"':(statusCor==="atendido"?' style="background:#4dcc83!important;color:#171717!important;border-color:#4dcc83!important"':''));
                  var dataAgendamento=dataHoraAgenda(a);
                  var ativoStatus=(String(a.status||"").toLowerCase()==="agendado" || String(a.status||"").toLowerCase()==="confirmado");
                  var ativo=ativoStatus && dataAgendamento && dataAgendamento.getTime()>=Date.now();
                  var botoes=ativo ?
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">'+
                    '<button class="btn secondary" style="padding:10px" type="button" onclick="openReschedule(\\''+escapeHtml(a.id)+'\\',\\''+escapeHtml(a.data_hora)+'\\')">Remarcar</button>'+
                    '<button class="btn secondary" style="padding:10px" type="button" onclick="cancelAppointment(\\''+escapeHtml(a.id)+'\\')">Cancelar</button>'+
                    '</div>' : '';
                  return '<div class="card'+cls+'">'+
                    '<div class="small">'+escapeHtml(formatDateTime(a.data_hora))+'</div>'+
                    '<b style="display:block;margin-top:5px">'+escapeHtml(a.servico||a.observacoes||"Serviço")+'</b>'+
                    '<div class="small" style="margin-top:6px">Cliente: '+escapeHtml(a.cliente_nome||"Cliente")+'</div>'+
                    '<div style="margin-top:8px"><span'+estiloBadge+'>'+escapeHtml(st)+'</span></div>'+
                    botoes+
                  '</div>';
                }).join("");
              }catch(error){
                console.error("Erro ao carregar agenda:",error);
                list.innerHTML='<div class="card"><b>Não foi possível carregar a agenda.</b><div class="small" style="margin-top:6px">A conexão demorou para responder. Toque em Atualizar para tentar novamente.</div><button class="btn secondary" style="margin-top:10px;width:100%" type="button" onclick="loadMyAgenda()">↻ Tentar novamente</button></div>';
              }
            };

            window.atualizarAgendaClienteAgora=async function(btn){
              if(btn){
                btn.disabled=true;
                btn.textContent="↻ Atualizando...";
              }

              try{
                if(typeof window.loadMyAgenda==="function"){
                  await window.loadMyAgenda();
                }
                if(typeof window.loadNotifications==="function"){
                  try{ await window.loadNotifications(); }catch(e){}
                }
                if(btn){
                  btn.textContent="✓ Atualizado";
                  setTimeout(function(){
                    btn.disabled=false;
                    btn.textContent="↻ Atualizar";
                  },900);
                }
              }catch(e){
                console.error("Erro ao atualizar sem recarregar o app:",e);
                if(btn){
                  btn.disabled=false;
                  btn.textContent="↻ Atualizar";
                }
              }
            };

            function ligarBotao(){
              var b=document.getElementById("btn-atualizar-online");
              if(b){
                b.onclick=function(){
                  window.atualizarAgendaClienteAgora(b);
                };
              }
            }

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",ligarBotao);
            }else{
              ligarBotao();
            }
          })();
          </script>
          '''

          if 'id="agenda-carregamento-online"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"\n</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Carregamento da Minha agenda corrigido.")
          PY

