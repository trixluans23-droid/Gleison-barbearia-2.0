name: Publicar sistema online

on:
  workflow_dispatch:
  push:
    paths:
      - 'GleisonBarbearia_2.0_V27_FCM.zip'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar sistema
        run: |
          rm -rf GleisonBarbeariaAndroid
          rm -rf site

          unzip -o "GleisonBarbearia_2.0_V27_FCM.zip"

          test -f GleisonBarbeariaAndroid/app/src/main/assets/index.html

          mkdir -p site

          cp GleisonBarbeariaAndroid/app/src/main/assets/index.html site/index.html

          echo "Sistema preparado para publicação."

      - name: Adicionar botão Atualizar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          code = r'''
          <button id="btn-atualizar-online" type="button" aria-label="Atualizar sistema">↻ Atualizar</button>
          <style>
          #btn-atualizar-online{position:fixed;right:16px;bottom:78px;z-index:2147483646;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px;background:#f2c14e;color:#111;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer}
          #btn-atualizar-online:active{transform:scale(.96)}
          </style>
          <script>
          document.getElementById("btn-atualizar-online").addEventListener("click",function(){
            this.disabled=true;
            this.textContent="↻ Atualizando...";
            var base=window.location.pathname;
            window.location.replace(base+"?atualizar="+Date.now());
          });
          </script>
          '''

          if 'id="btn-atualizar-online"' not in s and "<body>" in s:
              s = s.replace("<body>", "<body>" + code, 1)
              p.write_text(s, encoding="utf-8")

          print("Botão Atualizar adicionado ao sistema online.")
          PY

      - name: Substituir navegação inferior pelo menu de três pontos
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          s = p.read_text(encoding="utf-8")

          # Remove o botão de perfil que a versão anterior do deploy adicionava.
          s = s.replace('<button class="header-perfil-btn" type="button" onclick="tab(\'perfil\',this)" aria-label="Meu perfil" title="Meu perfil">👤</button>', '')

          code = r'''
          <style id="menu-tres-pontos-online">
          #menu-tres-pontos-btn{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:6px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:#171b1f;color:#fff;font:700 25px/1 Arial,sans-serif;cursor:pointer;flex:0 0 44px;padding:0}
          #menu-tres-pontos-btn:active{transform:scale(.95)}
          #menu-tres-pontos-overlay{display:none;position:fixed;inset:0;z-index:2147483645;background:rgba(0,0,0,.38)}
          #menu-tres-pontos-overlay.aberto{display:block}
          #menu-tres-pontos{position:absolute;top:68px;right:14px;width:min(300px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow:auto;background:#171b1f;border:1px solid rgba(242,193,78,.35);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.5);padding:8px}
          #menu-tres-pontos .menu-titulo{padding:10px 12px 8px;color:#f2c14e;font:700 14px Arial,sans-serif}
          #menu-tres-pontos button{display:flex;align-items:center;width:100%;min-height:46px;border:0;border-radius:10px;background:transparent;color:#fff;text-align:left;padding:10px 12px;font:600 15px Arial,sans-serif;cursor:pointer}
          #menu-tres-pontos button:active,#menu-tres-pontos button:hover{background:rgba(242,193,78,.12)}
          #menu-tres-pontos button .ico{width:28px;flex:0 0 28px;font-size:18px}
          #menu-tres-pontos .menu-fechar{margin-top:4px;border-top:1px solid rgba(255,255,255,.1);color:#f2c14e}
          .nav-account-stack{display:none!important}
          .header-perfil-btn{display:none!important}
          @media(max-width:520px){
            #menu-tres-pontos-btn{width:42px;height:42px;flex-basis:42px;font-size:24px}
            #menu-tres-pontos{top:62px}
          }
          </style>

          <div id="menu-tres-pontos-overlay" aria-hidden="true">
            <div id="menu-tres-pontos" role="menu" aria-label="Menu principal">
              <div class="menu-titulo">Menu</div>
              <button type="button" data-menu-acao="perfil"><span class="ico">👤</span>Perfil</button>
              <button type="button" data-menu-acao="inicio"><span class="ico">⌂</span>Início</button>
              <button type="button" data-menu-acao="agenda"><span class="ico">📅</span>Agenda</button>
              <button type="button" data-menu-acao="mensagens"><span class="ico">💬</span>Mensagens</button>
              <button type="button" data-menu-acao="barbearia"><span class="ico">✂</span>Barbearia</button>
              <button type="button" class="menu-fechar" data-menu-acao="fechar"><span class="ico">×</span>Fechar menu</button>
            </div>
          </div>

          <script id="menu-tres-pontos-script">
          (function(){
            function fecharMenu(){
              var o=document.getElementById("menu-tres-pontos-overlay");
              if(o){o.classList.remove("aberto");o.setAttribute("aria-hidden","true");}
            }
            function abrirMenu(){
              var o=document.getElementById("menu-tres-pontos-overlay");
              if(o){o.classList.add("aberto");o.setAttribute("aria-hidden","false");}
            }
            function clicarTab(nome){
              if(typeof window.tab==="function"){
                try{ window.tab(nome); return true; }catch(e){}
              }
              var botoes=Array.prototype.slice.call(document.querySelectorAll("button,a,[role='button']"));
              var b=botoes.find(function(el){
                var t=(el.innerText||el.textContent||"").trim().toLowerCase();
                if(nome==="inicio") return t==="início"||t==="inicio";
                if(nome==="agenda") return t==="agenda"||t.includes("agendamento");
                if(nome==="mensagens") return t==="mensagens";
                if(nome==="barbearia") return t==="barbearia";
                if(nome==="perfil") return t==="perfil"||t==="meu perfil";
                return false;
              });
              if(b){b.click();return true;}
              return false;
            }
            function esconderNavegacaoInferior(){
              var els=Array.prototype.slice.call(document.querySelectorAll("nav,footer,[class*='bottom'],[class*='nav']"));
              var candidatos=els.filter(function(el){
                if(el.id==="menu-tres-pontos-overlay") return false;
                var txt=(el.innerText||"").replace(/\s+/g," ").toLowerCase();
                if(!(txt.includes("agenda")&&txt.includes("mensagens")&&txt.includes("barbearia"))) return false;
                var r=el.getBoundingClientRect(), cs=getComputedStyle(el);
                return r.bottom>=window.innerHeight-140 && (cs.position==="fixed"||cs.position==="sticky"||cs.position==="absolute");
              });
              candidatos.sort(function(a,b){return a.getBoundingClientRect().height-b.getBoundingClientRect().height;});
              if(candidatos[0]) candidatos[0].style.setProperty("display","none","important");
            }
            function prepararMenu(){
              var header=document.querySelector("header");
              if(!header || document.getElementById("menu-tres-pontos-btn")) return;
              var btn=document.createElement("button");
              btn.id="menu-tres-pontos-btn";
              btn.type="button";
              btn.setAttribute("aria-label","Abrir menu");
              btn.setAttribute("title","Menu");
              btn.innerHTML="⋮";
              btn.addEventListener("click",function(e){e.stopPropagation();abrirMenu();});
              header.appendChild(btn);
            }
            document.addEventListener("click",function(e){
              var item=e.target.closest("[data-menu-acao]");
              if(!item) return;
              var acao=item.getAttribute("data-menu-acao");
              if(acao==="fechar"){fecharMenu();return;}
              fecharMenu();
              clicarTab(acao);
            });
            var overlay=document.getElementById("menu-tres-pontos-overlay");
            if(overlay) overlay.addEventListener("click",function(e){if(e.target===overlay)fecharMenu();});
            document.addEventListener("keydown",function(e){if(e.key==="Escape")fecharMenu();});
            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",function(){prepararMenu();esconderNavegacaoInferior();});
            }else{
              prepararMenu();esconderNavegacaoInferior();
            }
            window.addEventListener("resize",esconderNavegacaoInferior);
          })();
          </script>
          '''

          if 'id="menu-tres-pontos-online"' not in s and "</body>" in s:
              s = s.replace("</body>", code + "</body>", 1)

          p.write_text(s, encoding="utf-8")
          print("Menu de três pontos preparado; navegação inferior será ocultada.")
          PY

      - name: Marcar atendimentos encerrados
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <style id="status-atendimento-online">
          .atendimento-encerrado{border-color:rgba(220,53,69,.8)!important;box-shadow:0 0 0 2px rgba(220,53,69,.12) inset}
          .status-encerrado{display:inline-flex!important;align-items:center;gap:6px;background:#dc3545!important;color:#fff!important}
          .acoes-atendimento-encerrado{display:flex!important;gap:10px;flex-wrap:wrap;margin-top:12px}
          .acoes-atendimento-encerrado button{border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 14px;background:#171b1f;color:#fff;font:700 14px Arial,sans-serif;cursor:pointer}
          .status-final-atendido{background:#28a745!important;color:#fff!important}
          .status-final-nao-compareceu{background:#dc3545!important;color:#fff!important}
          </style>
          <script id="status-atendimento-script">
          (function(){
            var KEY="gleison_status_atendimentos_v2";

            function read(){
              try{return JSON.parse(localStorage.getItem(KEY)||"{}");}
              catch(e){return {};}
            }
            function write(v){
              try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}
            }
            function norm(v){return (v||"").replace(/\s+/g," ").trim();}

            function getDate(text){
              var m=norm(text).match(/(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/);
              if(!m)return null;
              var d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],0,0);
              return isNaN(d.getTime())?null:d;
            }

            function getCards(){
              var dateNodes=Array.prototype.slice.call(document.querySelectorAll("body *")).filter(function(el){
                var t=norm(el.textContent);
                return /(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/.test(t);
              });

              var found=[];
              dateNodes.forEach(function(node){
                var el=node;
                for(var i=0;i<7 && el;i++,el=el.parentElement){
                  var t=norm(el.innerText);
                  if(/Cliente:\s*/i.test(t) &&
                     /\bAgendado\b/i.test(t) &&
                     /(Remarcar|Cancelar)/i.test(t) &&
                     getDate(t)){
                    if(found.indexOf(el)<0) found.push(el);
                    break;
                  }
                }
              });
              return found;
            }

            function findStatus(card){
              var nodes=Array.prototype.slice.call(card.querySelectorAll("button,span,strong,b,p,div"));
              return nodes.find(function(el){
                return /^(Agendado|Atendido|Não compareceu|Atendimento encerrado)$/i.test(norm(el.textContent));
              });
            }

            function keyFor(card,dt){
              var t=norm(card.innerText);
              var nome=(t.match(/Cliente:\s*([^\n]+)/i)||[])[1]||"";
              var serv=(t.match(/^\s*(Corte(?:\s*\+\s*Barba)?|Barba|Sobrancelha|Serviço)\s*$/im)||[])[1]||"";
              return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")+"T"+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0")+"|"+norm(nome)+"|"+norm(serv);
            }

            function process(){
              var now=new Date(), saved=read();

              getCards().forEach(function(card){
                var dt=getDate(card.innerText);
                if(!dt || dt>now)return;

                var status=findStatus(card);
                if(!status)return;

                var current=norm(status.textContent);
                if(/^Cancelado$/i.test(current))return;

                var key=keyFor(card,dt);
                var final=saved[key];

                card.classList.add("atendimento-encerrado");

                if(final==="atendido"){
                  status.textContent="Atendido";
                  status.classList.add("status-final-atendido");
                  return;
                }

                if(final==="nao_compareceu"){
                  status.textContent="Não compareceu";
                  status.classList.add("status-final-nao-compareceu");
                  return;
                }

                status.textContent="Atendimento encerrado";
                status.classList.add("status-encerrado");

                if(card.querySelector(".acoes-atendimento-encerrado"))return;

                var box=document.createElement("div");
                box.className="acoes-atendimento-encerrado";

                var ok=document.createElement("button");
                ok.type="button";
                ok.textContent="✓ Atendido";

                var no=document.createElement("button");
                no.type="button";
                no.textContent="✕ Não compareceu";

                ok.onclick=function(){
                  var d=read();d[key]="atendido";write(d);
                  status.textContent="Atendido";
                  status.classList.add("status-final-atendido");
                  box.remove();
                };

                no.onclick=function(){
                  var d=read();d[key]="nao_compareceu";write(d);
                  status.textContent="Não compareceu";
                  status.classList.add("status-final-nao-compareceu");
                  box.remove();
                };

                box.appendChild(ok);
                box.appendChild(no);
                card.appendChild(box);
              });
            }

            function start(){
              process();
              setInterval(process,30000);
              new MutationObserver(function(){process();}).observe(document.body,{childList:true,subtree:true});
            }

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",start);
            }else{
              start();
            }
          })();
          </script>
          '''

          if 'id="status-atendimento-online"' in s:
              import re
              s=re.sub(r'<style id="status-atendimento-online">.*?</script>\s*', '', s, count=1, flags=re.S)
          if "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Regra de encerramento corrigida.")
          PY

      - name: Ordenar Minha agenda
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <script id="ordenacao-minha-agenda-script">
          (function(){
            function norm(v){return (v||"").replace(/\s+/g," ").trim();}
            function getDate(text){
              var m=norm(text).match(/(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/);
              if(!m)return null;
              var d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],0,0);
              return isNaN(d.getTime())?null:d;
            }
            function getCards(){
              var dateNodes=Array.prototype.slice.call(document.querySelectorAll("body *")).filter(function(el){
                return /(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/.test(norm(el.textContent));
              });
              var found=[];
              dateNodes.forEach(function(node){
                var el=node;
                for(var i=0;i<7 && el;i++,el=el.parentElement){
                  var t=norm(el.innerText);
                  if(/Cliente:\s*/i.test(t) &&
                     /(Agendado|Cancelado|Atendimento encerrado|Atendido|Não compareceu)/i.test(t) &&
                     getDate(t)){
                    var r=el.getBoundingClientRect();
                    if(r.width>200 && r.height>100 && found.indexOf(el)<0) found.push(el);
                    break;
                  }
                }
              });
              return found;
            }
            function status(card){
              var t=norm(card.innerText);
              if(/\bAgendado\b/i.test(t))return "agendado";
              if(/\bAtendimento encerrado\b/i.test(t))return "encerrado";
              if(/\bAtendido\b/i.test(t))return "atendido";
              if(/\bNão compareceu\b/i.test(t))return "nao_compareceu";
              if(/\bCancelado\b/i.test(t))return "cancelado";
              return "outro";
            }
            function order(card){
              var d=getDate(card.innerText);
              var st=status(card);
              var prioridade=st==="agendado"?0:1;
              return [prioridade,d?d.getTime():Number.MAX_SAFE_INTEGER];
            }
            function sortAgenda(){
              var cards=getCards();
              var groups=[];
              cards.forEach(function(card){
                var parent=card.parentElement;
                if(!parent)return;
                var g=groups.find(function(x){return x.parent===parent;});
                if(!g){g={parent:parent,cards:[]};groups.push(g);}
                if(g.cards.indexOf(card)<0)g.cards.push(card);
              });
              groups.forEach(function(g){
                if(g.cards.length<2)return;
                var sorted=g.cards.slice().sort(function(a,b){
                  var oa=order(a),ob=order(b);
                  if(oa[0]!==ob[0])return oa[0]-ob[0];
                  return oa[1]-ob[1];
                });
                sorted.forEach(function(card){g.parent.appendChild(card);});
              });
            }
            function start(){
              sortAgenda();
              setInterval(sortAgenda,30000);
              new MutationObserver(function(){sortAgenda();}).observe(document.body,{childList:true,subtree:true});
            }
            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);
            else start();
          })();
          </script>
          '''
          if 'id="ordenacao-minha-agenda-script"' not in s and "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)
          p.write_text(s,encoding="utf-8")
          print("Ordenação da Minha agenda adicionada.")
          PY

      - name: Validar alterações do sistema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path("site/index.html").read_text(encoding="utf-8")
          required = [
              'id="btn-atualizar-online"',
              'id="menu-tres-pontos-online"',
              'data-menu-acao="perfil"',
              'data-menu-acao="inicio"',
              'data-menu-acao="agenda"',
              'data-menu-acao="mensagens"',
              'data-menu-acao="barbearia"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Validação falhou; faltando: " + ", ".join(missing))
          if s.count('id="menu-tres-pontos-online"') != 1:
              raise SystemExit("Validação falhou: menu duplicado.")
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          menu_scripts = [x for x in scripts if 'function esconderNavegacaoInferior' in x]
          if len(menu_scripts) != 1:
              raise SystemExit("Validação falhou: script do menu não encontrado exatamente uma vez.")
          Path("/tmp/menu-check.js").write_text(menu_scripts[0], encoding="utf-8")
          PY
          node --check /tmp/menu-check.js
          test -s site/index.html
          echo "Validação concluída: estrutura e sintaxe JavaScript OK."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Criar pacote do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
