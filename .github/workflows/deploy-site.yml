          code=r'''
          <style id="forcar-cores-status-agenda">
          #agenda .badge.status-cor-agendado{background:#f2c14e!important;color:#171717!important;border-color:#f2c14e!important}
          #agenda .badge.status-cor-cancelado{background:#e53955!important;color:#fff!important;border-color:#e53955!important}
          #agenda .badge.status-cor-atendido{background:#4dcc83!important;color:#171717!important;border-color:#4dcc83!important}
          </style>
          <script id="forcar-cores-status-agenda-script">
          (function(){
            function aplicar(){
              var badges=document.querySelectorAll("#agenda .badge");
              badges.forEach(function(el){
                var t=(el.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
                var desejada="";
                if(t==="agendado"||t==="confirmado") desejada="status-cor-agendado";
                else if(t==="cancelado") desejada="status-cor-cancelado";
                else if(t==="atendido") desejada="status-cor-atendido";
                var classes=["status-cor-agendado","status-cor-cancelado","status-cor-atendido"];
                var atual=classes.find(function(c){return el.classList.contains(c);})||"";
                if(atual===desejada)return;
                classes.forEach(function(c){el.classList.remove(c);});
                if(desejada)el.classList.add(desejada);
              });
            }
            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",aplicar);
            else aplicar();
            // Não observar o body: aplicar() altera classes dos próprios badges e o observer
            // pode entrar em ciclo de mutações no Android WebView ao abrir Minha agenda.
            setInterval(aplicar,1000);
          })();
          </script>
          '''
