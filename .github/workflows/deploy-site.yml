          .gc-rec-senha-modal h2{margin:0 0 8px;color:#f2c14e;font:800 24px Arial,sans-serif}
          .gc-rec-senha-modal p{margin:0 0 18px;color:#c7ccd2;font:400 14px/1.45 Arial,sans-serif}
          .gc-rec-senha-modal label{display:block;margin:12px 0 6px;color:#fff;font:700 13px Arial,sans-serif}
          .gc-rec-senha-modal input{box-sizing:border-box;width:100%;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:#171c20;color:#fff;padding:13px 14px;font:600 16px Arial,sans-serif;outline:none}
