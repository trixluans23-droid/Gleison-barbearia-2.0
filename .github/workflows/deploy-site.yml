      - name: Marcar atendimentos encerrados
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          code=r'''
          <style id="status-atendimento-online">
          .atendimento-encerrado{border-color:rgba(220,53,69,.8)!important;box-shadow:0 0 0 2px rgba(220,53,69,.12) inset}
          .status-encerrado{display:inline-flex!important;align-items:center;gap:6px;background:#dc3545!important;color:#fff!important}
          .acoes-atendimento-encerrado{display:flex!important;gap:10px;flex-wrap:wrap;margin-top:12px}
          .acoes-atendimento-encerrado button{border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 14px;background:#171b1f;color:#fff;font:700 14px Arial,sans-serif;cursor:pointer}
          .status-final-atendido{background:#28a745!important;color:#fff!important}
          .status-final-nao-compareceu{background:#dc3545!important;color:#fff!important}
          </style>
          <script id="status-atendimento-script">
          (function(){
            var KEY="gleison_status_atendimentos_v2";

            function read(){
              try{return JSON.parse(localStorage.getItem(KEY)||"{}");}
              catch(e){return {};}
            }
            function write(v){
              try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}
            }
            function norm(v){return (v||"").replace(/\s+/g," ").trim();}

            function getDate(text){
              var m=norm(text).match(/(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/);
              if(!m)return null;
              var d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],0,0);
              return isNaN(d.getTime())?null:d;
            }

            function getCards(){
              var agenda=document.getElementById("agendaList");
              if(!agenda)return [];
              return Array.prototype.slice.call(agenda.querySelectorAll(".card")).filter(function(el){
                var t=norm(el.innerText);
                return /Cliente:\s*/i.test(t) &&
                       /\b(?:Agendado|Confirmado)\b/i.test(t) &&
                       /(Remarcar|Cancelar)/i.test(t) &&
                       getDate(t);
              });
            }

            function findStatus(card){
              var nodes=Array.prototype.slice.call(card.querySelectorAll("button,span,strong,b,p,div"));
              return nodes.find(function(el){
                return /^(Agendado|Atendido|Não compareceu|Atendimento encerrado)$/i.test(norm(el.textContent));
              });
            }

            function keyFor(card,dt){
              var t=norm(card.innerText);
              var nome=(t.match(/Cliente:\s*([^\n]+)/i)||[])[1]||"";
              var serv=(t.match(/^\s*(Corte(?:\s*\+\s*Barba)?|Barba|Sobrancelha|Serviço)\s*$/im)||[])[1]||"";
              return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")+"T"+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0")+"|"+norm(nome)+"|"+norm(serv);
            }

            function process(){
              var now=new Date(), saved=read();

              getCards().forEach(function(card){
                var dt=getDate(card.innerText);
                if(!dt || dt>now)return;

                var status=findStatus(card);
                if(!status)return;

                var current=norm(status.textContent);
                if(/^Cancelado$/i.test(current))return;

                var key=keyFor(card,dt);
                var final=saved[key];

                card.classList.add("atendimento-encerrado");

                if(final==="atendido"){
                  status.textContent="Atendido";
                  status.classList.add("status-final-atendido");
                  return;
                }

                if(final==="nao_compareceu"){
                  status.textContent="Não compareceu";
                  status.classList.add("status-final-nao-compareceu");
                  return;
                }

                status.textContent="Atendimento encerrado";
                status.classList.add("status-encerrado");

                if(card.querySelector(".acoes-atendimento-encerrado"))return;

                var box=document.createElement("div");
                box.className="acoes-atendimento-encerrado";

                var ok=document.createElement("button");
                ok.type="button";
                ok.textContent="✓ Atendido";

                var no=document.createElement("button");
                no.type="button";
                no.textContent="✕ Não compareceu";

                ok.onclick=function(){
                  var d=read();d[key]="atendido";write(d);
                  status.textContent="Atendido";
                  status.classList.add("status-final-atendido");
                  box.remove();
                };

                no.onclick=function(){
                  var d=read();d[key]="nao_compareceu";write(d);
                  status.textContent="Não compareceu";
                  status.classList.add("status-final-nao-compareceu");
                  box.remove();
                };

                box.appendChild(ok);
                box.appendChild(no);
                card.appendChild(box);
              });
            }

            function start(){
              process();
              setInterval(process,30000);
              // Não observar todo o body: alterações na própria agenda geram novas mutações e podem travar o WebView.
            }

            if(document.readyState==="loading"){
              document.addEventListener("DOMContentLoaded",start);
            }else{
              start();
            }
          })();
          </script>
          '''

          if 'id="status-atendimento-online"' in s:
              import re
              s=re.sub(r'<style id="status-atendimento-online">.*?</script>\s*', '', s, count=1, flags=re.S)
          if "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Regra de encerramento corrigida.")
          PY

      - name: Corrigir ordenação da Minha agenda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          # Remove qualquer versão anterior do organizador.
          s=re.sub(r'\s*<script id="ordenacao-minha-agenda-script">.*?</script>\s*', '\n', s, count=0, flags=re.S)

          code=r'''
          <script id="ordenacao-minha-agenda-script">
          (function(){
            function norm(v){return (v||"").replace(/\s+/g," ").trim();}

            function getDate(text){
              var m=norm(text).match(/(\d{2})\/(\d{2})\/(\d{4})\s*[•·]\s*(\d{2}):(\d{2})/);
              if(!m)return null;
              var d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],0,0);
              return isNaN(d.getTime())?null:d;
            }

            function getCards(){
              var list=document.getElementById("agendaList");
              if(!list)return [];
              return Array.prototype.slice.call(list.querySelectorAll(".card")).filter(function(card){
                var t=norm(card.innerText);
                return getDate(t) && /Cliente:\s*/i.test(t);
              });
            }

            function status(card){
              var t=norm(card.innerText).toLowerCase();
              var dt=getDate(t);
              var futuro=dt && dt.getTime()>=Date.now();
              if((/\bagendado\b/.test(t)||/\bconfirmado\b/.test(t)) && futuro)return 0;
              if(/\batendido\b/.test(t)||/\batendimento encerrado\b/.test(t))return 1;
              if(/\bnão compareceu\b/.test(t)||/\bfaltou\b/.test(t))return 2;
              if(/\bcancelado\b/.test(t))return 3;
              if(/\bagendado\b/.test(t)||/\bconfirmado\b/.test(t))return 1;
              return 4;
            }

            function sort(){
              var cards=getCards();
              if(cards.length<2)return;
              var parent=cards[0].parentElement;
              if(!parent)return;
              cards=cards.filter(function(card){return card.parentElement===parent;});

              cards.sort(function(a,b){
                var sa=status(a), sb=status(b);
                if(sa!==sb)return sa-sb;
                var da=getDate(a.innerText), db=getDate(b.innerText);
                var ta=da?da.getTime():Number.MAX_SAFE_INTEGER;
                var tb=db?db.getTime():Number.MAX_SAFE_INTEGER;
                return ta-tb;
              });

              var atual=Array.prototype.slice.call(parent.children).filter(function(el){
                return cards.indexOf(el)>=0;
              });
              var mudou=atual.length!==cards.length || atual.some(function(el,i){return el!==cards[i];});
              if(!mudou)return;
              var frag=document.createDocumentFragment();
              cards.forEach(function(card){frag.appendChild(card);});
              parent.appendChild(frag);
            }

            function start(){
              // Existe código antigo no HTML que também pode tentar ordenar a lista.
              // O protetor roda após o carregamento e periodicamente, mas só move
              // os cards quando a ordem estiver realmente errada.
              sort();
              setTimeout(sort,500);
              setTimeout(sort,1500);
              setInterval(sort,1000);
            }

            if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);
            else start();
          })();
          </script>
          '''

          if "</body>" in s:
              s=s.replace("</body>",code+"</body>",1)

          p.write_text(s,encoding="utf-8")
          print("Ordenação completa da Minha agenda aplicada.")
          PY

