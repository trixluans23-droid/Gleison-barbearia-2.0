            function sb(){try{return window.supabaseClient||supabaseClient||null}catch(e){return window.supabaseClient||null}}
            function abrir(id){var e=document.getElementById(id);if(e){e.classList.add("aberto");e.setAttribute("aria-hidden","false")}}
            function fechar(id){var e=document.getElementById(id);if(e){e.classList.remove("aberto");e.setAttribute("aria-hidden","true")}}
            function msg(id,t,c){var e=document.getElementById(id);if(e){e.textContent=t||"";e.className="gc-rec-senha-msg "+(c||"gc-rec-senha-info")}}
            function emailVal(){return String((document.getElementById("gc-rec-senha-email")||{}).value||"").trim().toLowerCase()}
            function baseUrl(){return window.location.href.split("#")[0].split("?")[0]}

            async function restaurarCadastro(){
              var client=sb(); if(!client||!client.auth)return;
              try{
                var r=await client.rpc("recuperar_conta_cliente_logado");
                if(r.error)throw r.error;
                var c=Array.isArray(r.data)?(r.data[0]||null):r.data;
                if(c){
