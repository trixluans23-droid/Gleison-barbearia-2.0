      - name: Usar somente recuperação de senha por e-mail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")

          # Remove a implementação experimental de biometria/passkey.
          s=re.sub(r"<style[^>]*id=[\"']reconhecimento-biometrico-online-style[\"'][^>]*>.*?</style>\\s*", "", s, flags=re.S|re.I)
          s=re.sub(r"<script[^>]*id=[\"']reconhecimento-biometrico-online-script[\"'][^>]*>.*?</script>\\s*", "", s, flags=re.S|re.I)

          # Remove também a recuperação antiga por magic link/OTP, para impedir o e-mail "Your sign-in link".
          def limpar_magic_link(m):
              body=m.group(2)
              if "signInWithOtp" in body or "gc-recuperacao-overlay" in body or "recuperacao-conta-cliente-script" in body:
                  return ""
              return m.group(0)
          s=re.sub(r'(<script\b[^>]*>)(.*?)(</script>)', limpar_magic_link, s, flags=re.S|re.I)
          # Segurança extra: se algum script antigo escapar, remova o script inteiro que contém a chamada OTP.
          while "signInWithOtp" in s:
              antes=len(s)
              s=re.sub(r'<script\b[^>]*>.*?signInWithOtp.*?</script>\s*', '', s, count=1, flags=re.S|re.I)
              if len(s)==antes:
                  break
          s=re.sub(r'<button\b[^>]*>[^<]*(?:Recuperar acesso pelo e-mail|Já sou cliente e perdi meu acesso)[^<]*</button>\s*', '', s, flags=re.S|re.I)
          s=re.sub(r'<a\b[^>]*>[^<]*(?:Recuperar acesso pelo e-mail|Já sou cliente e perdi meu acesso)[^<]*</a>\s*', '', s, flags=re.S|re.I)

          # Remove qualquer script adicional que tenha sido criado especificamente para passkey/biometria.
          def limpar_script(m):
              tag,body,end=m.group(1),m.group(2),m.group(3)
              low=body.lower()
              termos=("signInWithPasskey","registerPasskey","reconhecimento facial","recuperação por biometria","passkey")
              if any(t.lower() in low for t in termos):
                  return ""
              return m.group(0)
          s=re.sub(r'(<script\b[^>]*>)(.*?)(</script>)', limpar_script, s, flags=re.S|re.I)

          # Remove botões/mensagens da biometria que eventualmente vieram do HTML original.
          s=re.sub(r'<button\\b[^>]*>.*?Ativar recuperação por biometria.*?</button>\\s*', '', s, flags=re.S|re.I)
          s=re.sub(r'<button\\b[^>]*>.*?Recuperar com reconhecimento facial.*?</button>\\s*', '', s, flags=re.S|re.I)
          s=re.sub(r'<[^>]+>\\s*Este celular/navegador não oferece biometria por passkey\\.\\s*</[^>]+>\\s*', '', s, flags=re.S|re.I)

          # Remove a versão anterior da recuperação por link/magic-link.
          s=re.sub(r"<style[^>]*id=[\"']recuperacao-conta-cliente-style[\"'][^>]*>.*?</style>\\s*", "", s, flags=re.S|re.I)
          s=re.sub(r"<div[^>]*id=[\"']gc-recuperacao-overlay[\"'][^>]*>.*?</div>\\s*</div>\\s*", "", s, count=1, flags=re.S|re.I)
          s=re.sub(r"<script[^>]*id=[\"']recuperacao-conta-cliente-script[\"'][^>]*>.*?</script>\\s*", "", s, flags=re.S|re.I)

          code=r'''
          <style id="recuperacao-senha-email-style">
          #gc-rec-senha-overlay,#gc-rec-senha-nova-overlay{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72)}
