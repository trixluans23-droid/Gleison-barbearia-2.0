name: Build APK - Som Gleison Barbearia

on:
  push:
    paths:
      - '.github/workflows/build-apk-som-gleison.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          rm -rf GleisonBarbeariaAndroid
          unzip -o "GleisonBarbearia_2.0_V27_FCM.zip"
          test -f GleisonBarbeariaAndroid/app/src/main/java/com/gleisonbarbearia/app/FirebaseMessagingService.java

      - name: Colocar sistema online atual no APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O APK deve usar exatamente a versão atualmente publicada no GitHub Pages.
          rm -rf /tmp/site-atual
          mkdir -p /tmp/site-atual
          curl -fsSL "https://trixluans23-droid.github.io/Gleison-barbearia-2.0/index.html?build=${{ github.run_id }}" -o /tmp/site-atual/index.html
          cp /tmp/site-atual/index.html GleisonBarbeariaAndroid/app/src/main/assets/index.html
          cp admin.html GleisonBarbeariaAndroid/app/src/main/assets/admin.html
          test -s GleisonBarbeariaAndroid/app/src/main/assets/index.html
          test -s GleisonBarbeariaAndroid/app/src/main/assets/admin.html
          grep -q "GLEISON BARBEARIA" GleisonBarbeariaAndroid/app/src/main/assets/index.html
          echo "Sistema publicado atualmente copiado para o APK."
          cat > GleisonBarbeariaAndroid/app/src/main/java/com/gleisonbarbearia/app/MainActivity.java <<'JAVA'
          package com.gleisonbarbearia.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA

          MANIFEST="GleisonBarbeariaAndroid/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          echo "WebView configurado para abrir o sistema atual."


      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Criar som personalizado
        run: |
          mkdir -p GleisonBarbeariaAndroid/app/src/main/res/raw
          ffmpeg -y -f lavfi -i "sine=frequency=880:duration=0.22" -f lavfi -i "sine=frequency=1320:duration=0.22" -f lavfi -i "sine=frequency=1760:duration=0.52" -filter_complex "[0:a]adelay=0|0[a0];[1:a]adelay=290|290[a1];[2:a]adelay=580|580[a2];[a0][a1][a2]amix=inputs=3:duration=longest,afade=t=in:st=0:d=0.01,afade=t=out:st=0.86:d=0.08,loudnorm=I=-14:TP=-1.5:LRA=7" -c:a libvorbis -q:a 5 GleisonBarbeariaAndroid/app/src/main/res/raw/gleison_notificacao.ogg

      - name: Configurar notificação com som personalizado
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("GleisonBarbeariaAndroid/app/src/main/java/com/gleisonbarbearia/app/FirebaseMessagingService.java")
          s = p.read_text()
          # The service class already has the same simple name as Firebase's base class,
          # so do not import FirebaseMessagingService; it would create a name collision.
          s = s.replace("import com.google.firebase.messaging.FirebaseMessagingService;\n", "")
          s = s.replace("public class FirebaseMessagingService extends FirebaseMessagingService {",
                          "public class FirebaseMessagingService extends com.google.firebase.messaging.FirebaseMessagingService {")
          if "import android.net.Uri;" not in s:
              marker = "import android.os.Build;"
              if marker in s:
                  s = s.replace(marker, marker + "\nimport android.net.Uri;", 1)
              else:
                  s = "import android.net.Uri;\n" + s
          if "R.raw.gleison_notificacao" not in s:
              marker = "NotificationChannel channel = new NotificationChannel("
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit("Não encontrei a criação do NotificationChannel.")
              endline = s.find("channel.enableVibration(true);", pos)
              if endline < 0:
                  raise SystemExit("Não encontrei o fim da configuração do NotificationChannel.")
              insert = '''    Uri soundUri = Uri.parse("android.resource://" + getPackageName() + "/" + R.raw.gleison_notificacao);
              android.media.AudioAttributes audioAttributes = new android.media.AudioAttributes.Builder()
                  .setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION)
                  .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION)
                  .build();
              channel.setSound(soundUri, audioAttributes);
              '''
              s = s[:endline] + insert + s[endline:]
          s = s.replace('.setDefaults(android.app.Notification.DEFAULT_SOUND | android.app.Notification.DEFAULT_VIBRATE);',
                        '.setVibrate(new long[]{0, 180, 70, 180, 70, 520});')
          s = s.replace('.setDefaults(Notification.DEFAULT_SOUND | Notification.DEFAULT_VIBRATE);',
                        '.setVibrate(new long[]{0, 180, 70, 180, 70, 520});')
          p.write_text(s)
          PY

      - name: Integrar lembrete nativo no Android
        run: |
          python3 <<'PY'
          from pathlib import Path

          java_dir = Path("GleisonBarbeariaAndroid/app/src/main/java/com/gleisonbarbearia/app")
          main = java_dir / "MainActivity.java"
          src = main.read_text(encoding="utf-8")
          src = src.replace("import android.webkit.WebViewClient;", "import android.webkit.WebViewClient;\nimport android.webkit.JavascriptInterface;")
          src = src.replace("setContentView(webView);", "webView.addJavascriptInterface(new GleisonAndroidBridge(this), \"GleisonAndroid\");\n                  setContentView(webView);")
          main.write_text(src, encoding="utf-8")

          (java_dir / "GleisonAndroidBridge.java").write_text(r'''package com.gleisonbarbearia.app;

import android.app.AlarmManager;
import android.app.PendingIntent;
import android.content.Context;
import android.content.Intent;
import android.webkit.JavascriptInterface;

public class GleisonAndroidBridge {
    private final Context context;
    public GleisonAndroidBridge(Context context) { this.context = context.getApplicationContext(); }

    @JavascriptInterface
    public void agendarLembrete(String dataHoraIso, String titulo, String corpo) {
        try {
            String iso = dataHoraIso == null ? "" : dataHoraIso.trim();
            if (iso.length() < 16) return;
            String normalized = iso.replace("T", " ");
            java.text.SimpleDateFormat f = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss", java.util.Locale.US);
            f.setTimeZone(java.util.TimeZone.getTimeZone("America/Sao_Paulo"));
            java.util.Date d = f.parse(normalized.length() >= 19 ? normalized.substring(0,19) : normalized + ":00");
            if (d == null) return;
            long trigger = d.getTime() - 20L * 60L * 1000L;
            if (trigger <= System.currentTimeMillis()) return;

            Intent intent = new Intent(context, GleisonReminderReceiver.class);
            intent.putExtra("titulo", titulo == null ? "Gleison Barbearia" : titulo);
            intent.putExtra("corpo", corpo == null ? "Seu horário é em aproximadamente 20 minutos." : corpo);
            int requestCode = Math.abs((iso + (titulo == null ? "" : titulo)).hashCode());
            PendingIntent pi = PendingIntent.getBroadcast(context, requestCode, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
            if (am != null) {
                if (android.os.Build.VERSION.SDK_INT >= 23) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, trigger, pi);
                else am.setExact(AlarmManager.RTC_WAKEUP, trigger, pi);
            }
        } catch (Exception ignored) {}
    }
}
''', encoding="utf-8")

          (java_dir / "GleisonReminderReceiver.java").write_text(r'''package com.gleisonbarbearia.app;

import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.PendingIntent;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.media.AudioAttributes;
import android.net.Uri;
import android.os.Build;

public class GleisonReminderReceiver extends BroadcastReceiver {
    private static final String CHANNEL_ID = "gleison_lembrete_v3";

    @Override public void onReceive(Context context, Intent received) {
        NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
        Uri sound = Uri.parse("android.resource://" + context.getPackageName() + "/" + R.raw.gleison_notificacao);
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Lembretes Gleison Barbearia", NotificationManager.IMPORTANCE_HIGH);
            AudioAttributes aa = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
            channel.setSound(sound, aa);
            channel.enableVibration(true);
            channel.setVibrationPattern(new long[]{0,180,70,180,70,700});
            manager.createNotificationChannel(channel);
        }
        Intent open = new Intent(context, MainActivity.class);
        open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
        PendingIntent pi = PendingIntent.getActivity(context, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
        String titulo = received.getStringExtra("titulo");
        String corpo = received.getStringExtra("corpo");
        if (titulo == null || titulo.trim().isEmpty()) titulo = "Gleison Barbearia";
        if (corpo == null || corpo.trim().isEmpty()) corpo = "Seu horário é em aproximadamente 20 minutos.";
        android.app.Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new android.app.Notification.Builder(context, CHANNEL_ID) : new android.app.Notification.Builder(context);
        b.setSmallIcon(R.drawable.ic_stat_notification).setContentTitle(titulo).setContentText(corpo).setStyle(new android.app.Notification.BigTextStyle().bigText(corpo)).setAutoCancel(true).setContentIntent(pi).setPriority(android.app.Notification.PRIORITY_HIGH).setVisibility(android.app.Notification.VISIBILITY_PUBLIC).setVibrate(new long[]{0,180,70,180,70,700});
        manager.notify((int)(System.currentTimeMillis() & 0x7fffffff), b.build());
    }
}
''', encoding="utf-8")

          manifest = Path("GleisonBarbeariaAndroid/app/src/main/AndroidManifest.xml")
          ms = manifest.read_text(encoding="utf-8")
          if 'android.permission.SCHEDULE_EXACT_ALARM' not in ms:
              ms = ms.replace('<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />')
          if 'android:name=".GleisonReminderReceiver"' not in ms:
              ms = ms.replace('    </application>', '        <receiver android:name=".GleisonReminderReceiver" android:exported="false" />\n    </application>')
          manifest.write_text(ms, encoding="utf-8")

          html = Path("GleisonBarbeariaAndroid/app/src/main/assets/index.html")
          h = html.read_text(encoding="utf-8")
          old = "    localStorage.setItem('gleison_telefone', telefoneNumeros);\n    closeBooking();"
          new = "    localStorage.setItem('gleison_telefone', telefoneNumeros);\n    if(window.GleisonAndroid && typeof window.GleisonAndroid.agendarLembrete==='function'){\n      window.GleisonAndroid.agendarLembrete(dataHora, 'Gleison Barbearia', 'Seu horário é em aproximadamente 20 minutos, às '+selectedTime+' — '+servico+'.');\n    }\n    closeBooking();"
          if "GleisonAndroid.agendarLembrete" not in h:
              if old not in h:
                  raise SystemExit("Ponto de confirmação do agendamento não encontrado.")
              h = h.replace(old, new, 1)
          html.write_text(h, encoding="utf-8")
          print("Lembrete local nativo integrado ao agendamento.")
          PY
          grep -q "GleisonAndroid.agendarLembrete" GleisonBarbeariaAndroid/app/src/main/assets/index.html
          test -f GleisonBarbeariaAndroid/app/src/main/java/com/gleisonbarbearia/app/GleisonReminderReceiver.java
          grep -q "GleisonReminderReceiver" GleisonBarbeariaAndroid/app/src/main/AndroidManifest.xml

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Aceitar licenças
        run: yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar compatibilidade AndroidX
        run: |
          PROPS="GleisonBarbeariaAndroid/gradle.properties"
          touch "$PROPS"
          grep -q '^android.useAndroidX=' "$PROPS" && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPS" || echo 'android.useAndroidX=true' >> "$PROPS"
          grep -q '^android.enableJetifier=' "$PROPS" && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPS" || echo 'android.enableJetifier=true' >> "$PROPS"

      - name: Compilar APK
        working-directory: GleisonBarbeariaAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GleisonBarbearia-2.0-som-gleison-debug-apk
          path: GleisonBarbeariaAndroid/app/build/outputs/apk/debug/app-debug.apk
